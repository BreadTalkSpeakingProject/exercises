<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Bedroom words: match the words to the pictures</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--p:#7b3f9e;--p2:#8c5db0;--card:#f3e8fb;--ok:#1f9d55;--ok-bg:#dff5e8;--bad:#d04545;--bad-bg:#fbe3e3}
*{box-sizing:border-box}
html{background:#a99bc4}
body{margin:0;min-height:100vh;padding:34px 12px 40px;color:var(--p);
  font:500 16px/1.4 Fredoka,"Trebuchet MS",system-ui,sans-serif;
  background:
   radial-gradient(circle at 12% 6%,rgba(255,255,255,.55) 0 3px,transparent 4px),
   radial-gradient(circle at 80% 3%,rgba(255,255,255,.5) 0 4px,transparent 5px),
   radial-gradient(circle at 92% 14%,rgba(255,255,255,.45) 0 3px,transparent 4px),
   radial-gradient(circle at 4% 40%,rgba(255,255,255,.4) 0 3px,transparent 4px),
   radial-gradient(circle at 95% 55%,rgba(255,255,255,.4) 0 3px,transparent 4px),
   linear-gradient(180deg,#8f86b8 0%,#b898b9 45%,#e0a7b4 100%);
  background-attachment:fixed}
.wrap{max-width:560px;margin:0 auto;position:relative}
.badge{position:absolute;left:50%;top:-24px;transform:translateX(-50%);background:var(--p);color:#fff;
  font-weight:600;font-size:1.5rem;line-height:1;padding:9px 34px;border-radius:50%/50%;border:4px solid #ece0f7;z-index:2}
.card{background:var(--card);border-radius:36px;padding:54px 22px 26px;box-shadow:0 10px 30px rgba(60,30,90,.25)}
h1{margin:0;text-align:center;font-weight:600;font-size:1.75rem;line-height:1.15}
hr{border:0;border-top:3px solid var(--p2);margin:16px 6px}
.zone{border:5px dotted var(--p2);border-radius:30px;padding:18px 14px 20px;margin:20px 0 6px}
.group{padding:14px 0 12px}
.group+.group{border-top:2px dashed rgba(140,93,176,.3)}
.row{display:flex;gap:12px;justify-content:center}
.item{flex:1 1 0;max-width:160px;min-width:0;display:flex;flex-direction:column;gap:7px}
.pic{width:100%;aspect-ratio:1/.85;object-fit:cover;border-radius:18px;border:3px solid var(--p);background:#fff;display:block}
.slot{min-height:44px;border:2.5px dashed var(--p2);border-radius:14px;background:rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;padding:3px;position:relative;transition:background .15s,border-color .15s}
.slot::before{content:"drop here";font-size:.75rem;color:rgba(123,63,158,.45)}
.slot.has::before{content:none}
.slot.hover,.slot.target{background:#fff;border-color:var(--p)}
.slot.ok{border-style:solid;border-color:var(--ok);background:var(--ok-bg)}
.slot.bad{border-style:solid;border-color:var(--bad);background:var(--bad-bg)}
.mark{position:absolute;right:-6px;top:-10px;width:22px;height:22px;border-radius:50%;background:#fff;font-size:.8rem;font-weight:600;display:none;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.slot.ok .mark{display:flex;color:var(--ok)}.slot.bad .mark{display:flex;color:var(--bad)}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px;min-height:36px;padding:6px;border-radius:14px}
.bank.hover{background:rgba(123,63,158,.1)}
.pill{background:var(--p);color:#fff;border-radius:14px;padding:6px 14px;font-size:.88rem;font-weight:500;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;text-align:center;line-height:1.2;box-shadow:0 2px 0 rgba(60,20,90,.35)}
.pill.sel{outline:3px solid #f2b705;outline-offset:2px}
.pill.ghosted{opacity:.25}
.slot .pill{width:100%;font-size:.8rem;padding:6px 6px;box-shadow:none}
.ghost{position:fixed;z-index:50;pointer-events:none;opacity:.92;transform:translate(-50%,-50%) scale(1.06);box-shadow:0 6px 14px rgba(0,0,0,.3)}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin-top:14px}
button.b{font:inherit;font-weight:600;border-radius:14px;padding:8px 22px;border:3px solid var(--p);background:transparent;color:var(--p);cursor:pointer}
button.b.main{background:var(--p);color:#fff}
.res{width:100%;text-align:center;font-weight:600;font-size:1.1rem;min-height:1.4em}
.res.good{color:var(--ok)}
.qs{margin:6px 8px 0;padding:0;list-style:none;font-weight:600;font-size:1.12rem;line-height:1.35}
.qs li{position:relative;padding-left:20px;margin:3px 0}
.qs li::before{content:"";position:absolute;left:4px;top:.6em;width:6px;height:6px;border-radius:50%;background:var(--p)}
@media(max-width:420px){.card{padding:50px 12px 22px;border-radius:30px}.zone{padding:12px 8px 16px}.row{gap:8px}.pill{font-size:.82rem;padding:6px 11px}h1{font-size:1.5rem}}
</style>
</head>
<body>
<div class="wrap">
  <div class="badge">7</div>
  <div class="card">
    <h1>Match the words to the pictures.</h1>
    <hr>
    <div class="zone" id="zone"></div>
    <div class="btns">
      <button class="b main" id="check">Check</button>
      <button class="b" id="show">Show answers</button>
      <button class="b" id="retry">Try again</button>
      <div class="res" id="res" aria-live="polite"></div>
    </div>
    <hr>
    <ul class="qs">
      <li>Do you have any of the items from the images?</li>
      <li>Do they affect your sleep a lot?</li>
    </ul>
  </div>
</div>

/* key = correct answer, label = text on the pill; pics are in picture order, bank is shown in this order */
const GROUPS=[
 {pics:[["flat sheet",IMG.g1[0]],["fitted sheet",IMG.g1[1]]],
  bank:["fitted sheet","flat sheet"]},
 {pics:[["bathrobe",IMG.g2[0]],["nightgown",IMG.g2[1]],["pajamas",IMG.g2[2]]],
  bank:["pajamas","bathrobe","nightgown"]},
 {pics:[["blanket",IMG.g3[0]],["duvet",IMG.g3[1]]],
  bank:["duvet","blanket"],label:{duvet:"duvet /duːˈveɪ/"}},
 {pics:[["twin bed",IMG.g4[0]],["bunk bed",IMG.g4[1]],["double bed",IMG.g4[2]]],
  bank:["twin bed","double bed","bunk bed"]},
 {pics:[["blackout curtains",IMG.g5[0]],["blinds",IMG.g5[1]]],
  bank:["blinds","blackout curtains"]}
];
const zone=document.getElementById("zone"),res=document.getElementById("res");
let sel=null,done=false;
const slots=[],pills=[]; // slots[{g,i,el,key}], pills[{g,key,el}]

function build(){
  zone.innerHTML="";slots.length=0;pills.length=0;sel=null;done=false;res.textContent="";res.className="res";
  GROUPS.forEach((G,gi)=>{
    const g=document.createElement("div");g.className="group";
    const row=document.createElement("div");row.className="row";
    G.pics.forEach(([key,src],i)=>{
      const it=document.createElement("div");it.className="item";
      const im=document.createElement("img");im.className="pic";im.src=src;im.alt="Picture "+(i+1);
      const s=document.createElement("div");s.className="slot";s.dataset.g=gi;
      s.innerHTML='<span class="mark"></span>';
      it.append(im,s);row.appendChild(it);
      slots.push({g:gi,i,el:s,key});
    });
    const bank=document.createElement("div");bank.className="bank";bank.dataset.g=gi;
    G.bank.forEach(k=>{
      const p=document.createElement("div");p.className="pill";p.tabIndex=0;p.setAttribute("role","button");
      p.textContent=(G.label&&G.label[k])||k;p.dataset.g=gi;
      bank.appendChild(p);pills.push({g:gi,key:k,el:p,bank});
      attach(p);
    });
    g.append(row,bank);zone.appendChild(g);
  });
  slots.forEach(s=>s.el.addEventListener("click",()=>{
    if(sel&&+sel.dataset.g===s.g){place(sel,s);setSel(null);}
  }));
}
const pillOf=el=>pills.find(p=>p.el===el);
const slotOf=el=>slots.find(s=>s.el===el);
function setSel(el){if(sel)sel.classList.remove("sel");sel=el;if(el)el.classList.add("sel");
  slots.forEach(s=>s.el.classList.toggle("target",!!el&&+el.dataset.g===s.g&&!s.el.classList.contains("has")));}
function clearMarks(){done=false;res.textContent="";res.className="res";
  slots.forEach(s=>{s.el.classList.remove("ok","bad");s.el.querySelector(".mark").textContent="";});}
function toBank(pill){const P=pillOf(pill);P.bank.appendChild(pill);
  const s=slots.find(x=>x.el.classList.contains("has")&&!x.el.contains(x.el.querySelector(".pill")||document.body));refresh();}
function refresh(){slots.forEach(s=>s.el.classList.toggle("has",!!s.el.querySelector(".pill")));}
function place(pill,slot){
  clearMarks();
  const old=slot.el.querySelector(".pill");
  if(old&&old!==pill)pillOf(old).bank.appendChild(old);
  slot.el.appendChild(pill);refresh();
}
function attach(p){
  let sx,sy,drag=false,ghost=null,id=null;
  p.addEventListener("pointerdown",e=>{
    if(e.button>0)return;id=e.pointerId;sx=e.clientX;sy=e.clientY;drag=false;
    p.setPointerCapture(id);e.preventDefault();
  });
  p.addEventListener("pointermove",e=>{
    if(id===null||e.pointerId!==id)return;
    if(!drag&&Math.hypot(e.clientX-sx,e.clientY-sy)>7){
      drag=true;ghost=p.cloneNode(true);ghost.className="pill ghost";ghost.style.width=p.offsetWidth+"px";document.body.appendChild(ghost);p.classList.add("ghosted");
      setSel(null);
    }
    if(drag){ghost.style.left=e.clientX+"px";ghost.style.top=e.clientY+"px";
      const g=+p.dataset.g;
      document.querySelectorAll(".slot.hover,.bank.hover").forEach(x=>x.classList.remove("hover"));
      const t=hit(e.clientX,e.clientY,g);if(t)t.el.classList.add("hover");}
  });
  const end=e=>{
    if(id===null||e.pointerId!==id)return;
    try{p.releasePointerCapture(id);}catch(_){}
    id=null;
    document.querySelectorAll(".slot.hover,.bank.hover").forEach(x=>x.classList.remove("hover"));
    if(drag){
      const t=hit(e.clientX,e.clientY,+p.dataset.g);
      ghost.remove();ghost=null;p.classList.remove("ghosted");
      if(t){if(t.slot)place(p,t.slot);else{clearMarks();pillOf(p).bank.appendChild(p);refresh();}}
      drag=false;return;
    }
    /* click */
    if(p.parentElement.classList.contains("slot")){clearMarks();pillOf(p).bank.appendChild(p);refresh();setSel(null);}
    else setSel(sel===p?null:p);
  };
  p.addEventListener("pointerup",end);
  p.addEventListener("pointercancel",e=>{if(ghost){ghost.remove();ghost=null;}p.classList.remove("ghosted");drag=false;id=null;});
  p.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();
    if(p.parentElement.classList.contains("slot")){clearMarks();pillOf(p).bank.appendChild(p);refresh();}
    else{ // place into first empty slot of its group
      const s=slots.find(x=>x.g===+p.dataset.g&&!x.el.classList.contains("has"));if(s)place(p,s);}}});
}
function hit(x,y,g){
  const els=document.elementsFromPoint(x,y);
  for(const el of els){
    const s=el.closest&&el.closest(".slot");if(s&&+s.dataset.g===g)return {el:s,slot:slotOf(s)};
    const b=el.closest&&el.closest(".bank");if(b&&+b.dataset.g===g)return {el:b,slot:null};
  }
  return null;
}
document.getElementById("check").addEventListener("click",()=>{
  let n=0;
  slots.forEach(s=>{
    const pill=s.el.querySelector(".pill");const ok=!!pill&&pillOf(pill).key===s.key;
    if(ok)n++;
    s.el.classList.toggle("ok",ok);s.el.classList.toggle("bad",!ok);
    s.el.querySelector(".mark").textContent=ok?"✓":"✗";
  });
  done=true;setSel(null);
  res.textContent=n+" / "+slots.length+(n===slots.length?"  Great job!":"");
  res.className="res"+(n===slots.length?" good":"");
});
document.getElementById("show").addEventListener("click",()=>{
  clearMarks();setSel(null);
  slots.forEach(s=>{const P=pills.find(p=>p.g===s.g&&p.key===s.key);
    const old=s.el.querySelector(".pill");if(old&&old!==P.el)pillOf(old).bank.appendChild(old);
    s.el.appendChild(P.el);});
  refresh();res.textContent="Answers shown";res.className="res";
});
document.getElementById("retry").addEventListener("click",build);
build();
window.EX={slots,pills,build};
</script>
</body>
