const PR=["who","which","where","whose"];

 ["A shareholder is a person {{}} owns shares of a company.","who","<b>who</b>. <i>a person</i> is a human, and the pronoun is the subject of <i>owns</i>. Not <i>which</i> (things), <i>where</i> (places) or <i>whose</i> (belongs to someone)."],
 ["Maersk is a company {{}} operates container ships.","which","<b>which</b>. <i>a company</i> is a thing, not a person. <i>who</i> is only for people."],
 ["The sorting center is the place {{}} parcels are put in groups by city.","where","<b>where</b>. <i>the place</i> is a place, and the clause says what happens there."],
 ["I have a friend {{}} father owns a small company.","whose","<b>whose</b>. The father belongs to the friend (<i>the friend's father</i>), and <i>whose</i> is followed by a noun."],
 ["The CEO is the person {{}} runs the company.","who","<b>who</b>. <i>the person</i> = a human being."],
 ["This is the graph {{}} shows the price of oil.","which","<b>which</b>. <i>the graph</i> is a thing."],
 ["That is the port {{}} the cars are loaded onto the ship.","where","<b>where</b>. <i>the port</i> is a place: the cars are loaded <i>there</i>."],
 ["The workers {{}} work at the factory start at 7 a.m.","who","<b>who</b>. <i>The workers</i> are people, and the pronoun is the subject of <i>work</i>."],
 ["We met a manager {{}} company sells cars in Europe.","whose","<b>whose</b>. The company belongs to the manager (<i>the manager's company</i>)."],
 ["Revenue is the money {{}} a company gets from its sales.","which","<b>which</b>. <i>the money</i> is a thing."],
 ["Moscow is the city {{}} the head office of many companies is.","where","<b>where</b>. <i>the city</i> is a place: the head office is <i>there</i>."],
 ["A subsidiary is a company {{}} belongs to a bigger company.","which","<b>which</b>. <i>a company</i> is a thing, not a person."]
];
const T2=[
 ["The man who runs the company is my uncle.","Yes","<b>Yes</b>. <i>who</i> (a person) can be replaced by <i>that</i>: <i>The man that runs the company</i>."],
 ["The graph which shows revenue is on page 5.","Yes","<b>Yes</b>. <i>which</i> (a thing) can be replaced by <i>that</i>."],
 ["The city where I work is very big.","No","<b>No</b>. <i>where</i> is for places. We cannot say <i>the city that I work</i>."],
 ["The girl whose brother works at Pfizer is my classmate.","No","<b>No</b>. <i>whose</i> shows that something belongs to someone. We never replace it with <i>that</i>."],
 ["The parcel which arrived yesterday was heavy.","Yes","<b>Yes</b>. <i>which</i> (a thing) can be replaced by <i>that</i>."],
 ["The office where the managers work is on the top floor.","No","<b>No</b>. <i>where</i> is for places, and <i>that</i> cannot replace it here."],
 ["Shareholders who own many shares get more money.","Yes","<b>Yes</b>. <i>who</i> (people) can be replaced by <i>that</i>."],
 ["The company whose revenue dropped sharply is not happy.","No","<b>No</b>. <i>whose</i> is never replaced by <i>that</i>."]
];
const T3=[
 ["Pfizer is a pharmaceutical company {{}} sells medicines and vaccines.","which","<b>which</b>. <i>a company</i> is a thing."],
 ["A vaccine is a medicine {{}} protects people from a disease.","which","<b>which</b>. <i>a medicine</i> is a thing."],
 ["Maersk is a Danish company {{}} operates container ships.","which","<b>which</b>. <i>a company</i> is a thing."],
 ["A freight rate is the price {{}} customers pay for carrying goods.","which","<b>which</b>. <i>the price</i> is a thing. (<i>that</i> is also possible, but it is not in the list.)"],
 ["A sorting center is a place {{}} parcels are put in groups by city.","where","<b>where</b>. <i>a place</i>: the parcels are sorted <i>there</i>."],
 ["People {{}} buy shares of a company are called shareholders.","who","<b>who</b>. <i>People</i> are humans."],
 ["A shareholder is happy when the company {{}} shares he owns makes a profit.","whose","<b>whose</b>. The shares belong to the shareholder, but the pronoun refers to <i>the company</i>: <i>the company's shares</i>."]
];
const T4=[
 [["The man who works here is my boss.","The man who he works here is my boss.","The man which works here is my boss."],"<b>The man who works here is my boss.</b> <i>who</i> is already the subject, so we do not repeat <i>he</i>. And <i>which</i> is not used for people."],
 [["The film which I watched yesterday was great.","The film which I watched it yesterday was great.","The film who I watched yesterday was great."],"<b>The film which I watched yesterday was great.</b> <i>which</i> already replaces <i>the film</i>, so <i>it</i> is not needed. <i>who</i> is for people."],
 [["The café where we met is closed.","The café where we met there is closed.","The café which we met is closed."],"<b>The café where we met is closed.</b> <i>where</i> already means <i>there</i>, so we do not add <i>there</i>. And <i>which we met</i> sounds like we met the café."],
 [["The students whose homework is late must stay.","The students who homework is late must stay.","The students whose their homework is late must stay."],"<b>The students whose homework is late must stay.</b> The homework belongs to the students, so we need <i>whose</i>. We do not add <i>their</i>: <i>whose</i> already shows who it belongs to."],
 [["I know a woman who owns three companies.","I know a woman who she owns three companies.","I know a woman which owns three companies."],"<b>I know a woman who owns three companies.</b> <i>a woman</i> is a person, so <i>who</i>, and we do not repeat <i>she</i>."],
 [["This is the office where the CEO works.","This is the office where the CEO works in.","This is the office who the CEO works."],"<b>This is the office where the CEO works.</b> <i>where</i> already includes <i>in</i>, so we do not add <i>in</i>. <i>who</i> is not used for places."]
];
const T5=[
 ["I have a colleague. She speaks four languages.",["I have a colleague who speaks four languages.","I have a colleague which speaks four languages.","I have a colleague whose speaks four languages."],"<b>who</b>. <i>a colleague</i> is a person and the subject of <i>speaks</i>."],
 ["This is the report. It shows the revenue.",["This is the report which shows the revenue.","This is the report who shows the revenue.","This is the report where shows the revenue."],"<b>which</b>. <i>the report</i> is a thing."],
 ["That is the town. My parents were born there.",["That is the town where my parents were born.","That is the town which my parents were born there.","That is the town whose my parents were born."],"<b>where</b>. <i>there</i> in the second sentence means a place."],
 ["She is the manager. Her team won the prize.",["She is the manager whose team won the prize.","She is the manager who team won the prize.","She is the manager which her team won the prize."],"<b>whose</b>. <i>Her team</i> = the team belongs to the manager, so <i>whose team</i>."],
 ["Pfizer is a company. It sells vaccines.",["Pfizer is a company which sells vaccines.","Pfizer is a company who sells vaccines.","Pfizer is a company where sells vaccines."],"<b>which</b>. <i>a company</i> is a thing."]
];

(function(){
  const el=document.createElement("section");el.className="card";
  el.innerHTML="<h2>Rules: relative clauses</h2><p class=\"note\">A relative clause gives more information about a noun. It comes <b>right after</b> the noun.</p>"+

  "<tr><td><b>where</b></td><td>places</td><td>A head office is the place <b>where</b> the top managers work.</td></tr>"+

  "<div class=\"box\"><b>Remember</b><br>1. <b>who / which / that</b> are already the subject. Do not repeat the subject: <i>The man who works here</i>, not <i>The man who he works here</i>.<br>2. <b>where</b> already means <i>in that place</i>. Do not add <i>there</i> or <i>in</i>.<br>3. <b>whose</b> + noun. Do not add <i>his, her, their</i>.<br>4. We never use <b>that</b> instead of <b>where</b> or <b>whose</b>.</div>";

RC("Rules: passive voice","We use the passive when the action is more important than the doer.","<div class=\"box\"><b>be + V3 (past participle)</b><br>Present: <i>The box <b>is</b> weighed. The boxes <b>are</b> sorted.</i><br>Past: <i>The box <b>was</b> taken. The cars <b>were</b> loaded.</i><br>Future: <i>The goods <b>will be</b> delivered.</i><br>The doer can be added with <b>by</b>: <i>The containers are carried by ships.</i><br>The verb <b>be</b> agrees with the <b>new</b> subject (the object of the active sentence). Some verbs have <b>no passive</b>: <i>The revenue remained stable</i>, not <i>was remained</i>.</div>");
MC(6,"Passive: choose the form","Choose the correct form of the verb.",[
 ["The parcels {{}} to the customers every day.","are delivered",["is delivered","was delivered","deliver"],"<b>are delivered</b>. <i>The parcels</i> is plural and <i>every day</i> = present: <i>are</i> + V3."],
 ["The box {{}} at the post office yesterday.","was weighed",["is weighed","were weighed","will be weighed"],"<b>was weighed</b>. <i>Yesterday</i> = past; <i>the box</i> is one thing: <i>was</i> + V3."],
 ["The cars {{}} in a factory.","are built",["is built","were built","build"],"<b>are built</b>. <i>The cars</i> is plural and the statement is general: <i>are</i> + V3 (<i>built</i>)."],
 ["Tomorrow, the goods {{}} by couriers.","will be delivered",["are delivered","were delivered","will deliver"],"<b>will be delivered</b>. <i>Tomorrow</i> = future: <i>will be</i> + V3."],
 ["Last week, the containers {{}} onto a ship.","were loaded",["was loaded","are loaded","will be loaded"],"<b>were loaded</b>. <i>Last week</i> = past; <i>the containers</i> is plural: <i>were</i> + V3."],
 ["The address {{}} on the box.","is written",["are written","was written","will write"],"<b>is written</b>. <i>The address</i> is one thing and the action is a normal step: <i>is</i> + V3 (<i>written</i>)."],
 ["Next month, the new cars {{}} at the dealership.","will be sold",["are sold","were sold","will sell"],"<b>will be sold</b>. <i>Next month</i> = future: <i>will be</i> + V3 (<i>sold</i>)."],
 ["The item {{}} in a box before it goes to the post office.","is packed",["are packed","was packed","packs"],"<b>is packed</b>. <i>The item</i> is one thing and the action is a general step: <i>is</i> + V3."]
]);
MC(7,"Active or passive?","Choose the correct form. Sometimes the sentence is active!",[
 ["The revenue {{}} sharply in 2022.","increased",["was increased","is increased","were increased"],"<b>increased</b>. The revenue changed by itself, so the sentence is active (Past Simple)."],
 ["Ships {{}} the containers across the sea every day.","carry",["carries","are carried","is carried"],"<b>carry</b>. <i>Ships</i> does the action (active) and is plural, so no <i>-s</i>."],
 ["The containers {{}} across the sea by ships every day.","are carried",["carry","carries","is carried"],"<b>are carried</b>. <i>The containers</i> receive the action (passive) and are plural: <i>are</i> + V3."],
 ["In 2024, the market share {{}} stable.","remained",["was remained","is remained","remain"],"<b>remained</b>. <i>Remain</i> has no passive. <i>In 2024</i> = Past Simple."],
 ["The shares of this company {{}} by thousands of people.","are bought",["buy","is bought","bought"],"<b>are bought</b>. <i>The shares</i> receive the action, and <i>shares</i> is plural: <i>are</i> + V3."],
 ["The company {{}} 5,000 new workers last year.","hired",["was hired","were hired","hires"],"<b>hired</b>. The company did the action (active), and <i>last year</i> = past."]

RC("Rules: describing graphs","We use a verb + an adverb, or an adjective + a noun.","<div class=\"box\"><b>Verbs:</b> increase / rise / grow (up) · decrease / drop / fall (down) · remain stable · reach a peak · almost double<br><b>Big change:</b> <i>sharply</i> (adverb after the verb) · <i>a sharp increase</i> (adjective before a noun)<br><b>Small change:</b> <i>slightly</i> · <i>a slight drop</i><br>The adverb describes a verb, the adjective describes a noun.</div>");

 ["{{}}, both economies are strong, but each of them has risks.","In conclusion",["To begin with","For example","However"],"<b>In conclusion</b> introduces the final summary."],

RC("Rules: speculating","We speak about possible situations and about the future.","<div class=\"box\"><b>First conditional:</b> If + Present Simple, … <b>will</b> + verb. <i>If the price drops, the company will earn less.</i> We do not use <i>will</i> after <i>if</i>.<br><b>might / could + verb</b> = it is possible. <i>The price might rise.</i> After <i>might / could</i> we use the base verb (no <i>to</i>, no <i>-s</i>).</div>");

/* ============ BAR / REPORT / SAVE ============ */
const scored=secs.filter(s=>s.total>0);
const TOTAL=scored.reduce((a,s)=>a+s.total,0);
const got=()=>scored.reduce((a,s)=>a+(s.checked&&!s.revealed?s.score:0),0);
function updateBar(){$("#fill").style.width=(100*got()/TOTAL)+"%";$("#score").textContent=got()+" / "+TOTAL}
function buildReport(){
  const d=new Date(),p=n=>String(n).padStart(2,"0");
  const nm=($("#nm").value||"").trim()||"(no name)";
  let t="Revision Homework – "+nm+" ("+d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes())+")\n\n";
  scored.forEach(s=>{t+="Task "+s.num+" "+s.label+": "+(s.revealed?"answers shown":s.checked?s.score+" / "+s.total:"not checked")+"\n"});
  t+="\nTotal: "+got()+" / "+TOTAL+"\n\nMISTAKES (every wrong answer, including ones fixed on retry)\n";
  let any=false;
  scored.forEach(s=>{if(!s.log.length)return;any=true;t+="\nTask "+s.num+" "+s.label+"\n";s.log.forEach(e=>{t+="  ✗ "+e.line+"   ["+(s.lastOk[e.i]?"fixed on retry":"still wrong")+"]\n"})});
  if(!any)t+="\n(no mistakes recorded)\n";
  let wr="";
  secs.forEach(s=>{if(s.extra&&s.extra.ta&&s.extra.ta.value.trim())wr+="\nTask "+s.num+" "+s.label+" – your text:\n"+s.extra.ta.value.trim()+"\n"});
  if(wr)t+="\nWRITING / NOTES (not scored)\n"+wr;
  return t;
}
$("#copy").addEventListener("click",()=>{
  const txt=buildReport();const m=$("#copied");
  const done=()=>{m.hidden=false;setTimeout(()=>{m.hidden=true},3500)};
  const fb=()=>{const ta=document.createElement("textarea");ta.value=txt;ta.style.cssText="position:fixed;left:-999px";document.body.appendChild(ta);ta.select();try{document.execCommand("copy")}catch(e){}document.body.removeChild(ta);done()};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,fb)}else fb();
});
function saveHtml(){
  const d=new Date(),pad=n=>String(n).padStart(2,"0");
  const day=d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  const clone=document.documentElement.cloneNode(true);
  const src=[].slice.call(document.querySelectorAll("input,select,textarea")),dst=[].slice.call(clone.querySelectorAll("input,select,textarea"));
  src.forEach((el,i)=>{
    if(el.tagName==="SELECT"){[].slice.call(dst[i].options).forEach((o,j)=>{if(j===el.selectedIndex)o.setAttribute("selected","");else o.removeAttribute("selected")});dst[i].setAttribute("disabled","")}
    else if(el.tagName==="TEXTAREA"){dst[i].textContent=el.value;dst[i].setAttribute("readonly","")}
    else{dst[i].setAttribute("value",el.value);dst[i].setAttribute("readonly","");dst[i].setAttribute("tabindex","-1")}
  });
  [].slice.call(clone.querySelectorAll("script,.tools,.out")).forEach(n=>n.remove());
  const st=document.createElement("style");st.textContent="input,textarea{pointer-events:none}select:disabled{color:#1c1c1c;opacity:1}";clone.querySelector("head").appendChild(st);
  const note=document.createElement("div");note.className="savedbar";
  const nm=($("#nm").value||"").trim();
  note.innerHTML="<b>Saved answers</b> · "+day+"<span id=\"nmv\"></span> · Score: <b>"+got()+" / "+TOTAL+"</b>";
  if(nm){note.querySelector("#nmv").textContent=" · "+nm}
  const hd=clone.querySelector("header.hd");hd.parentNode.insertBefore(note,hd.nextSibling);
  const box=document.createElement("section");box.className="card log";
  const h=document.createElement("h2");h.textContent="My results";const pre=document.createElement("pre");pre.textContent=buildReport();
  box.appendChild(h);box.appendChild(pre);clone.querySelector(".sheet").appendChild(box);
  const blob=new Blob(["<!DOCTYPE html>\n"+clone.outerHTML],{type:"text/html;charset=utf-8"});
  const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="Revision_homework_answers_"+day+".html";
  document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(()=>URL.revokeObjectURL(url),4000);
  const m=$("#saved");m.hidden=false;setTimeout(()=>{m.hidden=true},4500);
}
$("#save").addEventListener("click",saveHtml);
window.HW={sections:secs,buildReport,saveHtml};
updateBar();
})();
