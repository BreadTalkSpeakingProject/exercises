<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exercise Maker</title>
<style>
:root{--bg:#f4f5fb;--card:#fff;--ink:#1f2340;--muted:#646a8c;--line:#dde0f0;--soft:#f6f7fc;--acc:#5b5bd6;--onacc:#fff;--ok:#1f9d55;--okbg:#e6f7ed;--bad:#d64545;--warn:#b45309;--warnbg:#fff4e0}
@media (prefers-color-scheme:dark){:root{--bg:#12142a;--card:#1b1e3a;--ink:#e8eaf7;--muted:#a1a7c9;--line:#2d3159;--soft:#23274a;--acc:#9a9af2;--onacc:#10122a;--ok:#4cc57f;--okbg:#14301f;--bad:#f27c7c;--warn:#f2b27c;--warnbg:#33261a;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
header.top h1{font-size:17px;margin:0 8px 0 0}
button,.fbtn{font:600 13px system-ui,sans-serif;border-radius:10px;padding:8px 14px;cursor:pointer;background:var(--soft);color:var(--ink);border:1px solid var(--line)}
button.pri{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
button.sm{padding:4px 9px;font-size:12px}
button.del,.x{color:var(--bad)}
.x{padding:4px 0;width:30px;font-size:15px}
.fbtn input{display:none}
.main{display:grid;grid-template-columns:minmax(420px,600px) 1fr;height:calc(100% - 55px)}
.pane{overflow:auto;padding:14px 16px}
.edit{border-right:1px solid var(--line)}
.prev{padding:0;display:flex;flex-direction:column;background:var(--bg)}
.prev iframe{flex:1;border:0;width:100%;background:#fff}
.prevbar{display:flex;gap:10px;align-items:center;padding:8px 14px;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line)}
label.f{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:10px 0 3px}
input[type=text],select,textarea{width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;font:inherit;background:var(--card);color:var(--ink)}
input[type=text]:focus,textarea:focus,select:focus{outline:2px solid var(--acc);outline-offset:0;border-color:var(--acc)}
textarea{min-height:90px;resize:vertical}
.meta,.task{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.task h3{margin:0 0 6px;font-size:15px;display:flex;gap:6px;align-items:center}
.task h3 .sp{flex:1}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hint{color:var(--muted);font-size:12px;margin:2px 0 6px}
.warn{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:6px 10px;margin-top:8px;font-size:12px;white-space:pre-line}
.warn:empty{display:none}
.cnt{color:var(--muted);font-size:12px;font-weight:400}
.chk{display:flex;gap:6px;align-items:center;margin-top:8px;font-size:13px}
.add{margin:6px 0 20px}
.tpls{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.tpls button{border-radius:999px;padding:5px 12px;font-size:12px}
.tpls button.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.rw{display:grid;gap:6px;margin-bottom:6px;align-items:center}
.rw.p{grid-template-columns:1fr 1.6fr 1fr 30px}
.rw.s{grid-template-columns:1fr 30px}
.rw.t{grid-template-columns:1.6fr 90px 1fr 30px}
.rh{display:grid;gap:6px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:8px 0 4px}
.rh.p{grid-template-columns:1fr 1.6fr 1fr 30px}.rh.t{grid-template-columns:1.6fr 90px 1fr 30px}
.sr{margin-bottom:8px}
.sr .sub{display:grid;grid-template-columns:1fr auto;gap:6px;margin-top:4px}
.qb{border:1.5px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;background:var(--soft)}
.qb .qh{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.qb .qh b{white-space:nowrap}
.op{display:grid;grid-template-columns:34px 1fr 1fr 30px;gap:6px;margin-bottom:5px;align-items:center}
.op .tick{padding:6px 0;font-size:14px}
.op .tick.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.sub2{margin-top:8px}
details.o{margin-top:10px}details.o summary{cursor:pointer;font-weight:600;font-size:13px}
#start{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:28px 16px}
#start[hidden]{display:none}
.sw{max-width:960px;margin:0 auto}
.sw h2{font-size:24px;margin:0 0 4px}.sw p.sub{margin:0 0 20px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.tp{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;cursor:pointer;font:inherit;color:var(--ink);display:block;width:100%}
.tp:hover,.tp:focus-visible{border-color:var(--acc);transform:translateY(-2px)}
.tp .ic{font-size:30px;line-height:1;display:block;margin-bottom:8px}
.tp b{display:block;font-size:16px;margin-bottom:4px}
.tp span.d{display:block;color:var(--muted);font-size:13px;font-weight:400}
.tp span.n{display:block;margin-top:8px;font-size:12px;font-weight:600;color:var(--acc)}
.sbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.tabs{display:none}
.swg{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.swb{border:2px solid var(--line);border-radius:12px;padding:0;overflow:hidden;background:var(--card);cursor:pointer;text-align:center}
.swb i{display:block;height:38px}
.swb span{display:block;padding:4px 2px;font-size:12px;font-weight:600;color:var(--ink)}
.swb.on{border-color:var(--acc);outline:2px solid var(--acc)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;display:flex;gap:12px;align-items:center;max-width:92vw;box-shadow:0 6px 24px rgba(0,0,0,.3)}
#toast[hidden],#dlg[hidden]{display:none}
#dlg{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.dbox{background:var(--card);border-radius:16px;padding:20px;max-width:420px;width:100%}
.dbox p{margin:0 0 16px;font-size:15px}.dbtn{display:flex;gap:8px;justify-content:flex-end}
.empty{color:var(--muted);padding:20px;text-align:center;border:2px dashed var(--line);border-radius:14px;margin-bottom:12px}
@media (max-width:860px){
 .main{display:block;height:auto}
 .tabs{display:flex;gap:6px;padding:8px 16px}
 .edit{border-right:0}.prev{height:80vh}
 body.showprev .edit{display:none}body:not(.showprev) .prev{display:none}
 .rw.p,.rw.t{grid-template-columns:1fr 30px}.rh{display:none}
 .op{grid-template-columns:34px 1fr 30px}.op .why{grid-column:2/4}
}
</style>
</head>
<body>
<div id="toast" hidden></div>
<div id="dlg" hidden><div class="dbox"><p id="dlgMsg"></p><div class="dbtn"><button type="button" id="dlgNo">Cancel</button><button type="button" class="pri" id="dlgOk">OK</button></div></div></div>
<div id="start"><div class="sw"><h2 id="stH">What do you want to make?</h2><p class="sub" id="stS">Step 1: choose a template. Step 2: fill in the form. Students can switch to another template with the same content.</p><div class="grid" id="grid"></div>
<div class="sbar"><button type="button" id="stEx">Open the example exercise</button><button type="button" id="stOpen">Open a saved project</button><button type="button" id="stCancel" hidden>Cancel</button></div></div></div>
<header class="top">
<h1>Exercise Maker</h1>
<button class="pri" id="bExport" type="button">&#11015; Save exercise as a file (HTML)</button>
<button id="bSave" type="button">Save project (to edit later)</button>
<label class="fbtn">Open project<input type="file" id="fOpen" accept=".json,application/json"></label>
<button id="bExample" type="button">Load example</button>
<button id="bNew" type="button">New</button>
</header>
<div class="tabs"><button type="button" id="tEdit">Edit</button><button type="button" id="tPrev">Preview</button></div>
<div class="main">
<div class="pane edit" id="edit">
 <div id="tasks"></div>
 <div class="add"><button class="pri" id="bAdd" type="button">+ Add another activity (choose template)</button></div>
 <details class="meta" open><summary style="cursor:pointer;font-weight:700">Exercise settings: style, title, audio, video</summary>
  <label class="f">Visual style (students can change it too)</label><div class="swg" id="swg"></div><input type="hidden" id="mStyle">
  <label class="chk"><input type="checkbox" id="mAnim"> Animated background (flying objects, floating things)</label>
  <label class="chk"><input type="checkbox" id="mSwitch"> Students can switch the template (like Wordwall)</label>
  <label class="f" for="mTitle">Title</label><input type="text" id="mTitle" placeholder="e.g. Work vocabulary">
  <div class="row2"><div><label class="f" for="mKicker">Small heading above the title</label><input type="text" id="mKicker" placeholder="Interactive exercise"></div>
  <div><label class="f" for="mVideo">Video link (optional)</label><input type="text" id="mVideo" placeholder="https://youtu.be/..."></div></div>
  <label class="f" for="mIntro">Short intro for students (optional)</label><input type="text" id="mIntro" placeholder="Play the activities. Read the explanations.">
  <label class="f">Audio file (optional, embedded into the exercise)</label>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><label class="fbtn">Choose audio<input type="file" id="mAudio" accept="audio/*"></label><span id="audioInfo" class="hint" style="margin:0">no audio</span><button class="sm del" id="audioDel" type="button" style="display:none">Remove</button></div>
 </details>
</div>
<div class="pane prev"><div class="prevbar"><span>Live preview.</span> <button class="sm pri" id="bExport2" type="button">&#11015; Save as a file</button></div><iframe id="frame" sandbox="allow-scripts allow-same-origin allow-popups" title="Preview"></iframe></div>
</div>
<script>

op:4px;border-radius:12px}\n.watch{display:inline-flex;gap:8px;align-items:center;background:#fff;color:#2b2368;font-weight:700;text-decoration:none;border-radius:14px;padding:12px 18px;margin-top:8px}\n.hint{font-size:13px;opacity:.88;margin:12px 0 0}\n.namebar{margin:18px 0 6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}\n.namebar label{font-weight:600;font-size:14px}\n.namebar input{flex:1;min-width:180px;padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;font:inherit;background:var(--card);color:var(--ink)}\n.bar{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 0 8px}\n.bar-in{display:flex;align-items:center;gap:12px}\n.track{flex:1;height:10px;background:var(--line);border-radius:10px;overflow:hidden}\n.fill{height:100%;width:0;background:var(--c1);border-radius:10px;transition:width .35s}\n.bar-txt{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}\n.card{background:var(--card);border-radius:var(--r);padding:22px;margin:16px 0;border:1px solid var(--line);border-top:6px solid var(--c)}\n.card h2{margin:0 0 4px;font-size:19px;display:flex;align-items:center;gap:10px}\n.num{background:var(--c);color:var(--onc);width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:15px;flex:none}\n.inst{margin:0 0 16px;color:var(--muted);font-size:14px}\n.btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}\n.btn{border:0;border-radius:12px;padding:10px 18px;font:600 14px Poppins,system-ui,sans-serif;cursor:pointer;background:var(--c);color:var(--onc)}\n.btn.sec{background:var(--btn2);color:var(--ink)}\n.btn:hover{filter:brightness(.95)}\n.score{font-weight:700;font-size:15px;margin-left:auto;color:var(--c)}\n.msg{margin:8px 0 0;font-size:13px;color:var(--muted);min-height:18px}\n.why{margin-top:8px;padding:9px 12px;border-radius:10px;font-size:13px;line-height:1.5;border-left:4px solid var(--line);background:var(--s
