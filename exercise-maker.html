<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exercise Maker</title>
<style>
:root{--bg:#f4f5fb;--card:#fff;--ink:#1f2340;--muted:#646a8c;--line:#dde0f0;--soft:#f6f7fc;--acc:#5b5bd6;--onacc:#fff;--ok:#1f9d55;--bad:#d64545;--warn:#b45309;--warnbg:#fff4e0}
@media (prefers-color-scheme:dark){:root{--bg:#12142a;--card:#1b1e3a;--ink:#e8eaf7;--muted:#a1a7c9;--line:#2d3159;--soft:#23274a;--acc:#9a9af2;--onacc:#10122a;--ok:#4cc57f;--bad:#f27c7c;--warn:#f2b27c;--warnbg:#33261a;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
header.top h1{font-size:17px;margin:0 8px 0 0}
button,.fbtn{font:600 13px system-ui,sans-serif;border:0;border-radius:10px;padding:8px 14px;cursor:pointer;background:var(--soft);color:var(--ink);border:1px solid var(--line)}
button.pri{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
button.sm{padding:4px 9px;font-size:12px}
button.del{color:var(--bad)}
.fbtn input{display:none}
.main{display:grid;grid-template-columns:minmax(380px,520px) 1fr;height:calc(100% - 55px)}
.pane{overflow:auto;padding:14px 16px}
.edit{border-right:1px solid var(--line)}
.prev{padding:0;display:flex;flex-direction:column;background:var(--bg)}
.prev iframe{flex:1;border:0;width:100%;background:#fff}
.prevbar{display:flex;gap:10px;align-items:center;padding:8px 14px;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line)}
label.f{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:10px 0 3px}
input[type=text],select,textarea{width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;font:inherit;background:var(--card);color:var(--ink)}
textarea{min-height:150px;resize:vertical;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace}
.meta,.task{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.task h3{margin:0 0 4px;font-size:14px;display:flex;gap:6px;align-items:center}
.task h3 .sp{flex:1}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hint{color:var(--muted);font-size:12px;margin:2px 0 6px;white-space:pre-line}
.warn{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:6px 10px;margin-top:6px;font-size:12px;white-space:pre-line}
.warn:empty{display:none}
.cnt{color:var(--muted);font-size:12px;font-weight:400}
.chk{display:flex;gap:6px;align-items:center;margin-top:8px;font-size:13px}
.add{display:flex;gap:8px;margin:6px 0 20px}
.tabs{display:none}
@media (max-width:860px){
 .main{display:block;height:auto}
 .tabs{display:flex;gap:6px;padding:8px 16px}
 .edit{border-right:0}.prev{height:80vh}
 body.showprev .edit{display:none}body:not(.showprev) .prev{display:none}
}
</style>
</head>
<body>
<header class="top">
<h1>Exercise Maker</h1>
<button class="pri" id="bExport" type="button">⬇ Save exercise as a file (HTML)</button>
<button id="bSave" type="button">Save project (to edit later)</button>
<label class="fbtn">Open project<input type="file" id="fOpen" accept=".json,application/json"></label>
<button id="bExample" type="button">Load example</button>
<button id="bNew" type="button">New</button>
</header>
<div class="tabs"><button type="button" id="tEdit">Edit</button><button type="button" id="tPrev">Preview</button></div>
<div class="main">
<div class="pane edit" id="edit">
 <div class="meta">
  <label class="f" for="mStyle">Style (background and colors)</label><select id="mStyle"><option value="classic">1. Classic (violet, light or dark automatically)</option><option value="sunny">2. Sunny (warm paper, orange and pink, round shapes)</option><option value="chalk">3. Chalkboard (dark green board, chalk colors)</option></select>
  <label class="f" for="mTitle">Title</label><input type="text" id="mTitle" placeholder="e.g. Work vocabulary">
  <div class="row2"><div><label class="f" for="mKicker">Small heading above the title</label><input type="text" id="mKicker" placeholder="Interactive exercise"></div>
  <div><label class="f" for="mVideo">Video link (optional)</label><input type="text" id="mVideo" placeholder="https://youtu.be/..."></div></div>
  <label class="f" for="mIntro">Short intro for students (optional)</label><input type="text" id="mIntro" placeholder="Listen, then do the tasks. Press Check to see explanations.">
  <label class="f">Audio file (optional, embedded into the exercise)</label>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><label class="fbtn">Choose audio<input type="file" id="mAudio" accept="audio/*"></label><span id="audioInfo" class="hint" style="margin:0">no audio</span><button class="sm del" id="audioDel" type="button" style="display:none">Remove</button></div>
 </div>
 <div id="tasks"></div>
 <div class="add"><select id="addType" style="max-width:300px"></select><button class="pri" id="bAdd" type="button">+ Add task</button></div>
</div>
<div class="pane prev"><div class="prevbar" id="prevbar"><span>Live preview.</span> <button class="sm pri" id="bExport2" type="button">⬇ Save as a file</button></div><iframe id="frame" sandbox="allow-scripts allow-same-origin allow-popups" title="Preview"></iframe></div>
</div>
<script>
var RT="<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Exercise<\/title>\n<style>\n:root{--bg:#f4f5fb;--card:#fff;--ink:#1f2340;--muted:#646a8c;--line:#e0e3f1;--soft:#f6f7fc;\n--c1:#5b5bd6;--c2:#0e8f80;--c3:#d8650f;--c4:#b8348f;--c5:#2f7fc4;--onc:#fff;\n--ok:#1f9d55;--okbg:#e6f7ed;--okink:#14532d;--bad:#d64545;--badbg:#fdecec;--badink:#7f1d1d;\n--sel:#eef0ff;--gapbg:#fff7f0;--bankbg:#fff6ee;--bankline:#f0b98a;--bankink:#a4530f;--btn2:#eceefa;\n--hero:linear-gradient(135deg,#25285a,#3b2f7a 60%,#5b3a8f);--r:20px;--bgimg:none;--p0:#5b5bd6;--p1:#0e8f80;--p2:#d8650f;--p3:#b8348f;--p4:#2f7fc4;--p5:#7a8a12;--p6:#c43c3c;--p7:#6b4fb3}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#12142a;--card:#1b1e3a;--ink:#e8eaf7;--muted:#a1a7c9;--line:#2d3159;--soft:#23274a;\n--c1:#9a9af2;--c2:#35c9b5;--c3:#f59a54;--c4:#ee7fcb;--c5:#74b5f0;--onc:#10122a;\n--ok:#4cc57f;--okbg:#14301f;--okink:#c4efd3;--bad:#f27c7c;--badbg:#3b1a1a;--badink:#f7c9c9;\n--sel:#2b2f62;--gapbg:#35271b;--bankbg:#2f231a;--bankline:#7d5632;--bankink:#f2b27c;--btn2:#2a2e55;\n--p0:#9a9af2;--p1:#35c9b5;--p2:#f59a54;--p3:#ee7fcb;--p4:#74b5f0;--p5:#c6d85a;--p6:#f27c7c;--p7:#b9a1f0;color-scheme:dark}}\n*{box-sizing:border-box}\nhtml,body{margin:0}\nbody{background:var(--bgimg),var(--bg);color:var(--ink);font:15px/1.5 Poppins,system-ui,-apple-system,\"Segoe UI\",Roboto,Arial,sans-serif;overflow-x:hidden}\n.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}\n.wrap{max-width:860px;margin:0 auto;padding-bottom:48px}\n.hero{background:var(--hero);color:#fff;padding-top:24px;padding-bottom:26px}\n.hero-in{max-width:860px;margin:0 auto}\n.kicker{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.8;margin:0 0 8px}\n.hero h1{font-size:24px;line-height:1.25;margin:0 0 12px}\n.hero audio{width:100%;margin-top:4px;border-r ty{display:none}\n.whyok{border-left-color:var(--ok);background:var(--okbg);color:var(--okink)}\n.whybad{border-left-color:var(--bad);background:var(--badbg);color:var(--badink)}\n.q{padding:14px 0;border-bottom:1px dashed var(--line)}.q:last-child{border-bottom:0}\n.q>p{margin:0 0 10px;font-weight:600}\n.pills{display:flex;flex-direction:column;gap:8px}\n.pill{width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 14px;font:400 14px Poppins,system-ui,sans-serif;cursor:pointer}\n.pill:hover{border-color:var(--c)}\n.pill.sel{border-color:var(--c);background:var(--sel);font-weight:500}\n.pill.ok{border-color:var(--ok);background:var(--okbg);color:var(--okink);font-weight:600}\n.pill.bad{border-color:var(--bad);background:var(--badbg);color:var(--badink);font-weight:600}\n.mk{display:inline-block;min-width:1.1em;font-weight:700}.mk:empty{display:none}\n.tf{display:flex;gap:10px}.tf .pill{width:auto;min-width:110px;text-align:center}\n.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}\n.cols h3{margin:0 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}\n.col{display:flex;flex-direction:column;gap:8px;min-width:0}\n.it{position:relative;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 12px 10px 38px;font:400 14px Poppins,system-ui,sans-serif;cursor:pointer;min-height:44px}\n.it.term{font-weight:600}\n.it:hover{border-color:var(--c)}\n.it.pending{outline:3px solid var(--c);outline-offset:1px}\n.it .b{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:20px;height:20px;border-radius:50%;font-size:11px;font-weight:700;display:none;align-items:center;justify-content:center;color:#fff}\n.it.paired .b{display:flex}\n.it.ok{border-color:var(--ok);background:var(--okbg)}\n.it.bad{border-color:var(--bad);background:var(--badbg)}\n.mexp{margin-top:12px;display:flex;flex-directio /* ---------- parsers ---------- */
function parseMatch(t,w){
  var pairs=[],extra=[];
  trim(t.text).split(/\n/).forEach(function(l,n){l=trim(l);if(!l)return;
    if(l.charAt(0)==="+"){var d=trim(l.slice(1));if(d)extra.push(d);return;}
    var p=l.split("|").map(trim);
    if(p.length<2||!p[0]||!p[1]){w.push("Line "+(n+1)+": need  term | definition");return;}
    pairs.push({t:p[0],d:p[1],w:p.slice(2).join(" | ")});});
  if(pairs.length&&pairs.length<3)w.push("Add at least 3 pairs.");
  var seen={};pairs.forEach(function(p){if(seen[p.d])w.push("Two terms share the same definition: "+p.d);seen[p.d]=1;});
  return {type:"match",title:t.title,inst:t.inst,pairs:pairs,extra:extra,leftTitle:t.leftTitle,rightTitle:t.rightTitle};
}
function parseQuiz(t,w){
  var items=[];
  trim(t.text).split(/\n\s*\n/).forEach(function(b,bi){b=trim(b);if(!b)return;
    var q="",o=[];
    b.split(/\n/).forEach(function(l){l=trim(l);if(!l)return;var m=/^([*\-])\s*(.*)$/.exec(l);
      if(m){var p=m[2].split("|").map(trim);o.push({t:p[0],c:m[1]==="*",w:p.slice(1).join(" | ")});}
      else q+=(q?" ":"")+l;});
    var nc=o.filter(function(x){return x.c;}).length;
    if(!q)w.push("Question "+(bi+1)+": no question text");
    else if(o.length<2)w.push("Question "+(bi+1)+": need at least 2 options");
    else if(nc!==1)w.push("Question "+(bi+1)+": mark exactly one correct option with *");
    else if(o.some(function(x){return !x.t;}))w.push("Question "+(bi+1)+": an option is empty");
    else items.push({q:q,o:o});});
  return {type:"quiz",title:t.title,inst:t.inst,items:items};
}
function parseGap(t,w){
  var items=[],tot=0;
  trim(t.text).split(/\n/).forEach(function(l,n){l=trim(l);if(!l)return;
    var ix=l.indexOf("||"),why="";if(ix>=0){why=trim(l.slice(ix+2));l=trim(l.slice(0,ix));}
    var parts=[],gaps=[],re=/\[([^\]]+)\]/g,last=0,m;
    while((m=re.exec(l))){parts.push(l.slice(last,m.index));gaps.push({a:m[1].split("|").map(trim).filter(Boolean)});last=m.index+m[0].length;}
    parts.push(l.slice(last));
    if(!gaps.length){w.push("Line "+(n+1)+": put the answer in [brackets]");return;}
    if(gaps.some(function(g){return !g.a.length;})){w.push("Line "+(n+1)+": empty gap");return;}
    tot+=gaps.length;items.push({parts:parts,gaps:gaps,w:why});});
  return {type:"gap",title:t.title,inst:t.inst,items:items,bank:!!t.bank,bankTitle:"Words and phrases"};
}
function parseUnj(t,w){
  var items=[];
  trim(t.text).split(/\n/).forEach(function(l,n){l=trim(l);if(!l)return;
    var ix=l.indexOf("||"),why="";if(ix>=0){why=trim(l.slice(ix+2));l=trim(l.slice(0,ix));}
    var ans=l.split("//").map(trim).filter(Boolean);
    if(!ans.length||ans[0].split(/\s+/).length<2){w.push("Line "+(n+1)+": need a sentence of 2+ words");return;}
    function K(x){return x.toLowerCase().replace(/[.,!?;:]/g,"").split(/\s+/).sort().join(" ");}
    ans.forEach(function(a){if(K(a)!==K(ans[0]))w.push("Line "+(n+1)+": variants must use the same words");});
    items.push({ans:ans,w:why});});
  return {type:"unjumble",title:t.title,inst:t.inst,items:items};
}
function parseTF(t,w){
  var items=[];
  trim(t.text).split(/\n/).forEach(function(l,n){l=trim(l);if(!l)return;
    var p=l.split("|").map(trim);
    if(p.length<2||!/^(t|true|f|false)$/i.test(p[1])){w.push("Line "+(n+1)+": need  statement | T or F | why");return;}
    items.push({s:p[0],a:/^t/i.test(p[1]),w:p.slice(2).join(" | ")});});
  return {type:"tf",title:t.title,inst:t.inst,items:items};
}
