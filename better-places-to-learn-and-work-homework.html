<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Better places to learn and work</title>
<style>
:root{--paper:#f4f0eb;--card:#fff;--ink:#242424;--muted:#68615d;--accent:#ab321f;--soft:#fbece6;--line:#dcd4ce;--green:#246846;--red:#a12b27}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.6 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,select,textarea{font:inherit}button,select,input,textarea{outline-offset:4px}button{cursor:pointer;touch-action:manipulation}button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #ab321f88}button{border:1px solid var(--line);border-radius:9px;background:#fff;padding:10px 17px;color:var(--ink);font-weight:650;min-height:44px}button:hover{background:var(--soft)}button:disabled{cursor:default;opacity:.42}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.primary:hover{background:#8b2718}.wrap{max-width:1020px;margin:auto;padding:50px 28px 70px}header{margin:0 0 28px}h1{font:600 clamp(32px,4.5vw,49px)/1.15 Georgia,serif;letter-spacing:-.025em;margin:0;max-width:850px}h2{font:600 26px/1.3 Georgia,serif;margin:0}p{margin:9px 0}.progress-panel{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:0 0 44px;padding:20px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.progress-panel p{margin:0;font-size:14px}.progress-panel strong{display:block;font-size:19px}.muted{color:var(--muted);font-size:14px}progress{width:100%;height:6px;accent-color:var(--accent);display:block;margin-top:10px}.progress-copy{flex:1;min-width:0}.task{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:30px 32px;margin:0 0 32px;scroll-margin-top:20px}.task-head{display:flex;align-items:flex-start;gap:18px;margin-bottom:24px}.badge{display:grid;place-items:center;background:var(--ink);color:#fff;min-width:46px;height:46px;border-radius:10px;font-size:24px;font-weight:700}.task-head p{color:var(--muted);font-size:15px;margin:7px 0 0}.questions{display:grid;gap:15px}.question{border:1px solid var(--line);border-radius:12px;padding:18px 20px;min-width:0}.question.checked-correct{border-color:#83ad94}.question.checked-wrong{border-color:#c98c82}.prompt{margin:0 0 12px;font-size:16px}.qnum{color:var(--accent);font-size:13px;font-weight:750;margin-right:9px}.choices{display:flex;flex-wrap:wrap;gap:10px}.choice{display:inline-flex;align-items:center;gap:8px;min-height:42px;border:1px solid var(--line);border-radius:8px;padding:6px 13px;font-size:15px;cursor:pointer}.choice:has(input:checked){background:var(--soft);border-color:var(--accent)}input[type=radio]{width:17px;height:17px;margin:0;accent-color:var(--accent)}.gap{display:inline-block;vertical-align:baseline;max-width:100%;min-width:150px;margin:3px 5px}select{background:#fff;border:1px solid #a9988c;border-radius:7px;color:var(--ink);padding:8px 30px 8px 10px;min-height:44px;max-width:100%;font-size:16px}.context{font-size:15px;color:var(--muted);margin:0 0 11px}.error-word{background:var(--soft);border-radius:4px;padding:0 4px;text-decoration:underline;text-decoration-style:wavy;text-decoration-color:var(--accent);text-underline-offset:4px}.feedback{font-size:14px;margin:12px 0 0;border-radius:8px;padding:11px 13px;background:#f3f1ee;color:#514942}.feedback:empty{display:none}.feedback.correct{background:#edf6ef;color:#205c3c}.feedback.wrong{background:#fff0ea;color:#842b20}.feedback strong{font-weight:750}.task-controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:25px}.task-score{font-size:14px;color:var(--muted);margin:16px 0 0;min-height:22px}.tokens{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}.token{font-size:15px;font-weight:500;padding:7px 12px;min-height:40px;background:var(--soft);border-color:#e6c2b4}.answer-sentence{padding:12px 14px;border:1px dashed #c6b8ad;border-radius:9px;min-height:61px;margin-top:12px;font-size:16px;line-height:2}.answer-sentence .token{background:#fff;margin:3px 5px 3px 0}.prefix{font-weight:650;margin-right:8px}.sentence-hint{font-size:13px;color:var(--muted)}.clear-sentence{font-size:13px;font-weight:500;border:0;background:transparent;min-height:34px;padding:4px 0;margin-top:5px;color:var(--muted);text-decoration:underline}.results-panel{padding:4px 0 0}.results-panel h2{font-size:24px}.copy-status{min-height:24px;margin-top:12px;font-size:14px;color:var(--muted)}.fallback{background:#fff;padding:20px;border:1px solid var(--line);border-radius:12px;margin-top:15px}.fallback[hidden]{display:none}.fallback label{display:block;font-size:14px;margin-bottom:9px}.fallback textarea{display:block;width:100%;min-height:280px;border:1px solid var(--line);border-radius:8px;padding:12px;color:var(--ink);font:13px/1.6 ui-monospace,monospace}.footer-note{font-size:13px;color:var(--muted);margin-top:16px}noscript{display:block;background:#fff0ea;padding:16px;margin:20px 0}@media(max-width:600px){.wrap{padding:30px 16px 45px}.task{padding:23px 16px;border-radius:15px;margin-bottom:24px}.task-head{gap:12px;margin-bottom:20px}h2{font-size:23px}.badge{min-width:39px;height:39px;font-size:22px}.question{padding:15px 13px}.progress-panel{align-items:flex-start;flex-wrap:wrap;margin-bottom:30px;gap:14px}.progress-copy{flex-basis:100%}.progress-panel button{width:100%}.task-controls button{flex:1}.task-controls{gap:9px}.choice{padding:6px 10px}.gap{margin-left:0;margin-right:0}.answer-sentence{padding:10px}.token{font-size:14px}.task-head p{font-size:14px}}@media print{body{background:#fff}.wrap{max-width:none;padding:0}.progress-panel,.task-controls,.results-panel,.clear-sentence{display:none}.task{break-inside:avoid;box-shadow:none}.tokens{display:none}.feedback{font-size:11px}}

</style>
</head>
<body>
<div class="wrap">
<header><h1>Better places to learn and work</h1></header>
<noscript>Open this file in a browser with JavaScript enabled to check your answers.</noscript>
<div class="progress-panel" aria-label="Homework progress">
 <div class="progress-copy"><strong id="totalScore">Score: 0 / 30</strong><p id="overallStatus" aria-live="polite"></p><progress id="progress" value="0" max="30" aria-label="Checked and correct answers"></progress></div>
 <button type="button" class="copy-results">Copy Results</button>
</div>
<main id="tasks"></main>
<section class="results-panel" aria-label="Results to share">
 <h2>Your results</h2><p class="muted">Check each task, then copy your results to share with your teacher.</p>
 <button type="button" class="primary copy-results">Copy Results</button>
 <p class="copy-status" id="copyStatus" role="status"></p>
 <div class="fallback" id="copyFallback" hidden><label for="resultsText">Automatic copying is unavailable. Select and copy the text below.</label><textarea id="resultsText" readonly></textarea></div>
 <p class="footer-note">Your answers are saved in this browser when local storage is available.</p>
</section>
</div>
<script>
'use strict';
const TITLE='Better places to learn and work';
const tasks=[
 {id:'nouns',number:1,title:'Countable or uncountable?',kind:'choice',instruction:'Think about these nouns in a training centre. Choose the correct category.',bank:['uncountable','countable'],questions:[
  {prompt:'information on a course website',target:"information",answer:'uncountable',why:'Information has no plural -s in this meaning. We say some information.'},
  {prompt:'equipment in a computer room',target:"equipment",answer:'uncountable',why:'Equipment is uncountable: the equipment is ready.'},
  {prompt:'project deadline',target:"deadline",answer:'countable',why:'You can count deadlines: one deadline, two deadlines.'},
  {prompt:'knowledge of a programming language',target:"knowledge",answer:'uncountable',why:'Knowledge is uncountable and takes a singular verb.'},
  {prompt:'desk in a study room',target:"desk",answer:'countable',why:'One desk, two desks: desk is countable.'},
  {prompt:'training session',target:"training session",answer:'countable',why:'One training session, several training sessions.'},
  {prompt:'practical work experience',target:"experience",answer:'uncountable',why:'Experience means general knowledge and skills gained by working here. In this meaning, it is uncountable.'},
  {prompt:'useful suggestion',target:"suggestion",answer:'countable',why:'One suggestion, two suggestions: suggestion is countable.'}
 ]},
 {id:'quantifiers',number:2,title:'What needs to change?',kind:'select',instruction:'Complete the sentences about a new training centre. Use the context to choose the best answer.',bank:['too many','enough','too','not enough','too much'],questions:[
  {context:'Only two of the twelve learners can sit down.',prompt:'There are {gap} chairs for the group.',answer:'not enough',why:'The group needs more chairs. Not enough goes before the noun.'},
  {context:'The connection is very slow, so we cannot join the video lesson.',prompt:'The internet connection is {gap} slow.',answer:'too',why:'Use too before an adjective: too slow.'},
  {context:'Please stop sending extra documents. I cannot read them all.',prompt:'You are sending me {gap} information.',answer:'too much',why:'Information is uncountable. Too much means more than is useful or needed.'},
  {context:'The room has exactly one desk for each of the six learners. Nobody needs another desk.',prompt:'There are {gap} desks for everyone.',answer:'enough',why:'The number is sufficient. Enough goes before desks.'},
  {context:'Twenty people have arrived for a workshop in a room designed for six.',prompt:'There are {gap} people in this room.',answer:'too many',why:'People is plural and countable. The number is too large.'},
  {context:'Each learner needs one hour of practice, but the schedule allows only ten minutes.',prompt:'There is {gap} practice time.',answer:'not enough',why:'The learners need more practice time.'},
  {context:'The centre has all the money it needs for the new laptops.',prompt:'The centre has {gap} money to buy them.',answer:'enough',why:'There is sufficient money. Money is uncountable, but enough works with both noun types.'},
  {context:'The course costs more than our team can pay.',prompt:'The course is {gap} expensive for us.',answer:'too',why:'Use too with an adjective: too expensive.'}
 ]},
 {id:'repair',number:3,title:'Repair the sentence',kind:'choice',instruction:'The underlined part is incorrect. Choose its replacement. Read the complete corrected sentence before you check.',questions:[
  {prompt:'All the equipment [are] ready for the workshop.',options:['are','be','is'],answer:'is',why:'Equipment is uncountable, so it takes is.'},
  {prompt:'There [are] a clear plan for the next stage.',options:['is','have','are'],answer:'is',why:'A clear plan is singular: there is a clear plan.'},
  {prompt:'The new software [give] us useful information.',options:['give','gives','giving'],answer:'gives',why:'Software is uncountable and takes a singular verb: it gives.'},
  {prompt:'A new employee [need] enough time to learn the system.',options:['need','needing','needs'],answer:'needs',why:'A new employee is one person. Use the third-person form needs.'},
  {prompt:'The trainer gave me [an information] about the course.',options:['an information','some information','a few information'],answer:'some information',why:'Information is uncountable. We cannot use an or a few directly before it.'},
  {prompt:'These coding [skill] help me work faster.',options:['skills','skilled','skill'],answer:'skills',why:'These requires a plural noun: these coding skills.'},
  {prompt:'She hopes to gain [many experience] during the internship.',options:['many experience','a few experience','more experience'],answer:'more experience',why:'Experience is uncountable here. Say gain more experience or gain practical experience.'},
  {prompt:'A mentor can provide useful [advices] for new employees.',options:['an advice','advices','advice'],answer:'advice',why:'Advice is uncountable: useful advice. Provide advice is a natural word combination.'}
 ]},
 {id:'sentences',number:4,title:'Build the sentence',kind:'order',instruction:'Start with the bold words. Click or tap the pieces in the correct order. Click a chosen piece to put it back.',questions:[
  {prefix:'There',words:['noise','the shared office.','is','in','too much'],order:[2,4,0,3,1],answer:'There is too much noise in the shared office.',why:'Use there is with uncountable noise, and too much before the noun.'},
  {prefix:'The interns',words:['experience','the project.','enough','don’t have','to lead'],order:[3,2,0,4,1],answer:'The interns don’t have enough experience to lead the project.',why:'Enough comes before the uncountable noun experience.'},
  {prefix:'We',words:['the new equipment.','space','need','for','enough'],order:[2,4,1,3,0],answer:'We need enough space for the new equipment.',why:'Enough space is the correct order. Space and equipment are uncountable in this context.'},
  {prefix:'These online courses',words:['for','expensive','our team.','too','are'],order:[4,3,1,0,2],answer:'These online courses are too expensive for our team.',why:'Courses is plural, so use are. Too comes before the adjective expensive.'},
  {prefix:'A good mentor',words:['new employees.','useful','provides','for','advice'],order:[2,1,4,3,0],answer:'A good mentor provides useful advice for new employees.',why:'A good mentor takes provides. Advice is uncountable.'},
  {prefix:'A short break',words:['your','is','concentration.','to improve','a good way'],order:[1,4,3,0,2],answer:'A short break is a good way to improve your concentration.',why:'A short break is singular. Use is and a good way.'}
 ]}
];
const state={};const views=new Map();const STORAGE='better-places-homework-v1';
for(const task of tasks)state[task.id]=task.questions.map(()=>({value:task.kind==='order'?[]:'',checked:false}));
try{const saved=JSON.parse(localStorage.getItem(STORAGE)||'null');if(saved)for(const t of tasks)if(Array.isArray(saved[t.id])&&saved[t.id].length===t.questions.length)saved[t.id].forEach((s,i)=>{const valid=t.kind==='order'?Array.isArray(s.value)&&s.value.every(x=>Number.isInteger(x)&&x>=0&&x<t.questions[i].words.length)&&new Set(s.value).size===s.value.length:typeof s.value==='string'&&(s.value===''||(t.bank||t.questions[i].options).includes(s.value));if(valid)state[t.id][i]={value:s.value,checked:!!s.checked};});}catch(e){}
function el(tag,cls,text){const x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=text;return x;}
function status(t,i){const s=state[t.id][i],q=t.questions[i];if(t.kind==='order'){if(!s.value.length)return 'unanswered';if(s.value.length<q.words.length)return 'incomplete';}else if(!s.value)return 'unanswered';if(!s.checked)return 'unchecked';return t.kind==='order'?(s.value.every((v,j)=>v===q.order[j])?'correct':'wrong'):(s.value===q.answer?'correct':'wrong');}
function answerText(t,i){const s=state[t.id][i],q=t.questions[i];return t.kind==='order'?(s.value.length?q.prefix+' '+s.value.map(v=>q.words[v]).join(' '):'(no answer)'):(s.value||'(no answer)');}
function tally(t){const s={correct:0,wrong:0,unanswered:0,unchecked:0,incomplete:0,total:t.questions.length};t.questions.forEach((q,i)=>s[status(t,i)]++);return s;}
function scoreText(s){return `${s.correct} / ${s.total} correct · ${s.wrong} to review · ${s.unanswered} unanswered · ${s.unchecked} answered but unchecked`+(s.incomplete?` · ${s.incomplete} incomplete`:'');}
function refreshSummary(){const sum={correct:0,wrong:0,unanswered:0,unchecked:0,incomplete:0,total:0};for(const t of tasks){const v=tally(t);for(const k of Object.keys(sum))sum[k]+=v[k];views.get(t.id).score.textContent=scoreText(v);}document.getElementById('totalScore').textContent=`Score: ${sum.correct} / ${sum.total}`;document.getElementById('overallStatus').textContent=`${sum.wrong} to review · ${sum.unanswered} unanswered · ${sum.unchecked} answered but unchecked`+(sum.incomplete?` · ${sum.incomplete} incomplete`:'');document.getElementById('progress').value=sum.correct;try{localStorage.setItem(STORAGE,JSON.stringify(state));}catch(e){}return sum;}
function refreshQuestion(t,i){const v=views.get(t.id).rows[i],s=state[t.id][i],q=t.questions[i],st=status(t,i);v.row.classList.toggle('checked-correct',st==='correct');v.row.classList.toggle('checked-wrong',st==='wrong');v.feedback.className='feedback';v.feedback.replaceChildren();if(s.checked){let intro=st==='correct'?'Correct.':st==='unanswered'?'Not answered.':st==='incomplete'?'Incomplete sentence.':'Please review.';if(st==='correct')v.feedback.classList.add('correct');else if(st==='wrong')v.feedback.classList.add('wrong');v.feedback.append(el('strong','',intro+' '));if(st!=='correct')v.feedback.append(document.createTextNode('Correct answer: '+q.answer+(/[.!?]$/.test(q.answer)?' ':'. ')));v.feedback.append(document.createTextNode(q.why));}if(t.kind==='order')paintOrder(t,i);else if(t.kind==='select')v.select.value=s.value;else for(const input of v.inputs)input.checked=input.value===s.value;}
function changed(t,i){state[t.id][i].checked=false;refreshQuestion(t,i);refreshSummary();}
function paintOrder(t,i){const v=views.get(t.id).rows[i],q=t.questions[i],s=state[t.id][i];v.chosen.replaceChildren(el('span','prefix',q.prefix));for(const idx of s.value){const b=el('button','token',q.words[idx]);b.type='button';b.setAttribute('aria-label','Remove '+q.words[idx]);b.addEventListener('click',()=>{s.value=s.value.filter(j=>j!==idx);changed(t,i);});v.chosen.append(b);}v.tokens.forEach((b,j)=>{b.disabled=s.value.includes(j);});v.clear.disabled=!s.value.length;}
function check(t){state[t.id].forEach(s=>s.checked=true);t.questions.forEach((q,i)=>refreshQuestion(t,i));refreshSummary();}
function retry(t){state[t.id].forEach(s=>{s.value=t.kind==='order'?[]:'';s.checked=false;});t.questions.forEach((q,i)=>refreshQuestion(t,i));refreshSummary();}
for(const t of tasks){const section=el('section','task');section.id='task-'+t.id;section.setAttribute('aria-labelledby','heading-'+t.id);const head=el('div','task-head');head.append(el('div','badge',t.number));const title=el('div');const heading=el('h2','',t.title);heading.id='heading-'+t.id;title.append(heading,el('p','',t.instruction));head.append(title);section.append(head);const list=el('div','questions');section.append(list);const v={section,rows:[]};views.set(t.id,v);
 t.questions.forEach((q,i)=>{const row=el('div','question'),p=el('p','prompt'),num=el('span','qnum',i+1+'.');p.append(num);const view={row,feedback:el('div','feedback')};view.feedback.id=`feedback-${t.id}-${i}`;view.feedback.setAttribute('aria-live','polite');
  if(q.context)row.append(el('p','context',q.context));
  if(t.kind==='select'){const [before,after]=q.prompt.split('{gap}');p.append(document.createTextNode(before));const select=el('select');select.setAttribute('aria-label',`Task ${t.number}, question ${i+1}: ${q.prompt.replace('{gap}','blank')}`);select.setAttribute('aria-describedby',view.feedback.id);select.append(new Option('Choose…',''));for(const option of t.bank)select.append(new Option(option,option));select.addEventListener('change',()=>{state[t.id][i].value=select.value;changed(t,i);});view.select=select;const wrap=el('span','gap');wrap.append(select);p.append(wrap,document.createTextNode(after));row.append(p);
  }else if(t.kind==='order'){p.append(document.createTextNode('Start: '+q.prefix));row.append(p);view.chosen=el('div','answer-sentence');view.chosen.setAttribute('aria-label',`Your sentence for question ${i+1}`);row.append(view.chosen);const bank=el('div','tokens');view.tokens=q.words.map((word,j)=>{const b=el('button','token',word);b.type='button';b.setAttribute('aria-label','Add '+word);b.addEventListener('click',()=>{if(!state[t.id][i].value.includes(j)){state[t.id][i].value.push(j);changed(t,i);}});bank.append(b);return b;});row.append(bank);view.clear=el('button','clear-sentence','Clear sentence');view.clear.type='button';view.clear.addEventListener('click',()=>{state[t.id][i].value=[];changed(t,i);});row.append(view.clear);
  }else{if(t.id==='repair'){const m=q.prompt.match(/^(.*?)\[(.*?)\](.*)$/);p.append(document.createTextNode(m[1]),el('span','error-word',m[2]),document.createTextNode(m[3]));}else if(q.target){const at=q.prompt.indexOf(q.target);p.append(document.createTextNode(q.prompt.slice(0,at)),el('strong','target-noun',q.target),document.createTextNode(q.prompt.slice(at+q.target.length)));}else p.append(document.createTextNode(q.prompt));row.append(p);const choices=el('div','choices');choices.setAttribute('role','radiogroup');choices.setAttribute('aria-label',`Task ${t.number}, question ${i+1}: ${q.prompt.replace(/[\[\]]/g,'')}`);view.inputs=(t.bank||q.options).map(option=>{const label=el('label','choice'),input=el('input');input.type='radio';input.name=`${t.id}-${i}`;input.value=option;input.setAttribute('aria-describedby',view.feedback.id);input.addEventListener('change',()=>{state[t.id][i].value=option;changed(t,i);});label.append(input,el('span','',option));choices.append(label);return input;});row.append(choices);}
  row.append(view.feedback);list.append(row);v.rows.push(view);
 });const controls=el('div','task-controls'),checkButton=el('button','primary','Check answers'),retryButton=el('button','','Try again');checkButton.type=retryButton.type='button';checkButton.addEventListener('click',()=>check(t));retryButton.addEventListener('click',()=>retry(t));controls.append(checkButton,retryButton);v.score=el('p','task-score');v.score.setAttribute('role','status');section.append(controls,v.score);document.getElementById('tasks').append(section);t.questions.forEach((q,i)=>refreshQuestion(t,i));
}

function buildReport(){const sum=refreshSummary();let out=[TITLE,'',`Total: ${scoreText(sum)}`];for(const t of tasks){out.push('',`Task ${t.number} — ${t.title}`,scoreText(tally(t)));t.questions.forEach((q,i)=>{const st=status(t,i);if(st==='correct')return;out.push(`${i+1}. [${st.toUpperCase()}] ${t.kind==='order'?'Start: '+q.prefix+'. Pieces: '+q.words.join(' / '):q.prompt.replace('{gap}','_____').replace(/[\[\]]/g,'')}`,`Your answer: ${answerText(t,i)}`,`Correct answer: ${q.answer}`);});}return out.join('\n');}
async function copyResults(){const report=buildReport(),fallback=document.getElementById('copyFallback'),area=document.getElementById('resultsText'),msg=document.getElementById('copyStatus');area.value=report;try{if(!navigator.clipboard?.writeText)throw new Error('Clipboard unavailable');await navigator.clipboard.writeText(report);fallback.hidden=true;msg.textContent='Results copied. You can paste them into a message.';}catch(e){fallback.hidden=false;msg.textContent='Select and copy your results below.';area.focus();area.select();}}
document.querySelectorAll('.copy-results').forEach(b=>b.addEventListener('click',copyResults));refreshSummary();
</script>
</body>
</html>
