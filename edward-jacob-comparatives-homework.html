<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Edward vs Team Jacob – Comparatives and Superlatives Homework</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Karla:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f7f7;--ink:#1f2b2c;--muted:#5f7375;--card:#fff;--line:#d3e3e3;--ok:#d9f5df;--okb:#2e9e4f;--no:#fde0dc;--nob:#d8493a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Karla,system-ui,sans-serif;font-size:17px;line-height:1.55}
h1,h2{font-family:"Bricolage Grotesque",Karla,system-ui,sans-serif;margin:0}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 80px}
header{padding:28px 0 10px}
header h1{font-size:30px}
header p{color:var(--muted);margin:6px 0 0}
.name{margin:14px 0}
.name input{font:inherit;padding:9px 12px;border:2px solid var(--line);border-radius:10px;width:100%;max-width:320px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.bar .track{flex:1;height:10px;background:#dbe9e9;border-radius:8px;overflow:hidden}
.bar .fill{height:100%;width:0;background:#3e6a6d;transition:width .3s}
.bar b{font-family:"Bricolage Grotesque",sans-serif;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-top:6px solid var(--acc);border-radius:16px;padding:18px;margin:20px 0}
.card h2{font-size:22px;color:var(--acc)}
.card .ins{color:var(--muted);margin:4px 0 14px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:10px 12px;border:2px solid transparent;border-radius:12px;margin:6px 0;background:#f8fcfc}
.row.ok{background:var(--ok);border-color:var(--okb)}
.row.no{background:var(--no);border-color:var(--nob)}
.para{display:block;padding:12px 14px;border:2px solid transparent;border-radius:12px;margin:8px 0;background:#f8fcfc}
.para.ok{background:var(--ok);border-color:var(--okb)}
.para.no{background:var(--no);border-color:var(--nob)}
.para.plain{background:transparent}
select,input[type=text]{font:inherit;padding:6px 9px;border:2px solid var(--line);border-radius:9px;background:#fff;max-width:100%}
input[type=text]{width:170px}
.hint{color:var(--muted);font-style:italic;margin:0 4px}
.pill{font:inherit;border:2px solid var(--line);background:#fff;border-radius:999px;padding:4px 14px;cursor:pointer;margin:0 3px}
.pill.sel{background:#1f2b2c;color:#fff;border-color:#1f2b2c}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
button.b{font:inherit;font-weight:600;border:0;border-radius:10px;padding:9px 16px;cursor:pointer;background:var(--acc);color:#fff}
button.b.alt{background:#fff;color:var(--ink);border:2px solid var(--line)}
.score{font-weight:700;margin-left:6px}
.msg{color:var(--muted);font-size:15px}
.final{margin:24px 0;text-align:center}
.final button{font-size:19px;padding:13px 26px}
.mail{background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:10px;font-size:15px;color:var(--muted)}
@media(max-width:560px){input[type=text]{width:130px}}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>💌 Team Edward vs Team Jacob</h1>
<p>Comparatives and superlatives · A2 · 3 tasks. Press <b>Check</b> in each task. At the end, press <b>Copy my results</b> and send them to your teacher.</p>
</header>
<div class="name"><label>Your name: <input id="stuName" type="text" placeholder="Name"></label></div>
<div class="bar"><div class="track"><div class="fill" id="fill"></div></div><b id="prog">0 / 0</b></div>
<div id="tasks"></div>
<div class="final"><button class="b" id="copyBtn" style="background:#1f2b2c">Copy my results</button><p class="msg" id="copyMsg"></p></div>
</div>

<script>
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>s.toLowerCase().replace(/[’]/g,"'").replace(/[.!?]+$/,"").replace(/\s+/g," ").trim();
const plain=s=>s.replace(/<[^>]*>/g,"");
const el=(t,c)=>{const e=document.createElement(t);if(c)e.className=c;return e};

/* ---------- DATA ---------- */
const RULES=[
`We use comparatives to compare [two] people or things.`,
`We use superlatives to compare [three or more] people or things.`,
`We use [than] after a comparative adjective.`,
`We usually use [the] before a superlative adjective.`,
`For short adjectives, we usually add [-er] to make the comparative.`,
`For longer adjectives, we make the comparative with [more] + adjective.`,
`For short adjectives, the superlative is [the ___est].`,
`For longer adjectives, the superlative is [the most ___].`
];
const RULE_BANK=["two","three or more","than","the","-er","more","the ___est","the most ___"];

const CHOOSE=[
`Jacob is {friendlier than*|friendlyer than|the friendliest than} Edward.`,
`Edward is {mysteriouser than|more mysterious than*|most mysterious than} Jacob.`,
`Jacob is {strongest than|more strong than|stronger than*} Edward.`,
`Bella thinks Jacob is {the funnier|the funniest*|the funnyest} person she knows.`,
`Edward is {the more important|the importantest|the most important*} person in her life.`,
`Jacob is a {gooder|better*|more good} friend than Edward.`,
`Edward is {reliabler|the reliable|more reliable*} than Jacob.`,
`Sherlock Holmes is {the most intelligent*|more intelligent|the intelligentest} person on the list.`,
`Harry Potter is {bravest than|braver than*|more braver than} Jack Sparrow.`,
`This is {the worse|the baddest|the worst*} joke I know.`
];

/* text for the memory task: [answer|word in brackets] */
const MAIL=[
{plain:true,t:`Hi Alice, I know you don't want to hear from me after everything that happened, but I really need to talk to someone. Since Edward left, I've tried to be okay. Then there is Jacob.`},
{t:`At first, I just wanted to spend time with him because I didn't want to be alone. But now he's become a really good friend. He is [friendlier|friendly] than Edward and definitely [funnier|funny]. I can actually relax when I'm with him. And, obviously, he's [stronger|strong] than Edward!`},
{t:`But Edward is still Edward. He is [more mysterious|mysterious] than Jacob, and I think he's [more romantic|romantic], too. I also feel that Edward is [more reliable|reliable]. When he says he'll protect me, I believe him.`},
{t:`Sometimes I think Jacob is [the best|good] person for me right now. He's there when I need a friend. But Edward is still [the most important|important] person in my life.`},
{t:`And then I start thinking that Jacob might actually be [the funniest|funny] person I know, while Edward is [the most mysterious|mysterious].`},
{plain:true,t:`How am I supposed to choose? Please tell me what you think. Love, Bella`}
];

/* ---------- TASK BUILDERS ---------- */
function ruleTask(body){
  body.innerHTML="";
  const bank=shuffle(RULE_BANK);
  const rows=RULES.map((t,idx)=>{
    const m=t.match(/\[([^\]]*)\]/);
    const row=el("div","row");
    row.appendChild(document.createTextNode(t.slice(0,m.index)));
    const sel=document.createElement("select");
    const o0=document.createElement("option");o0.value="";o0.textContent="— choose —";sel.appendChild(o0);
    bank.forEach(w=>{const o=document.createElement("option");o.value=w;o.textContent=w;sel.appendChild(o)});
    row.appendChild(sel);
    row.appendChild(document.createTextNode(t.slice(m.index+m[0].length)));
    return {row,sel,ans:m[1],before:t.slice(0,m.index),after:t.slice(m.index+m[0].length),idx};
  });
  shuffle(rows).forEach(r=>body.appendChild(r.row));
  const ok=r=>r.sel.value===r.ans;
  return {
    total:rows.length,
    check(){let n=0;rows.forEach(r=>{const g=ok(r);r.row.classList.toggle("ok",g);r.row.classList.toggle("no",!g);if(g)n++});return n},
    report(){return rows.map(r=>({ok:ok(r),line:`${r.before}${r.sel.value||"___"}${r.after}   (correct: ${r.ans})`}))},
    fill(){rows.forEach(r=>{r.sel.value=r.ans})}
  };
}

function parseChoice(t){
  const m=t.match(/\{([^}]*)\}/);
  const raw=m[1].split("|");
  return {before:t.slice(0,m.index),after:t.slice(m.index+m[0].length),opts:raw.map(o=>o.replace("*","")),correct:raw.find(o=>o.endsWith("*")).replace("*","")};
}
function chooseTask(body){
  body.innerHTML="";
  const rows=CHOOSE.map((t,idx)=>{
    const it=parseChoice(t);
    const row=el("div","row");
    row.appendChild(document.createTextNode(it.before));
    const r={row,it,idx,val:null,pills:[]};
    shuffle(it.opts).forEach(o=>{
      const b=el("button","pill");b.type="button";b.textContent=o;
      b.onclick=()=>{r.val=o;r.pills.forEach(p=>p.classList.toggle("sel",p===b))};
      r.pills.push(b);row.appendChild(b);
    });
    row.appendChild(document.createTextNode(it.after));
    return r;
  });
  shuffle(rows).forEach(r=>body.appendChild(r.row));
  const ok=r=>r.val===r.it.correct;
  return {
    total:rows.length,
    check(){let n=0;rows.forEach(r=>{const g=ok(r);r.row.classList.toggle("ok",g);r.row.classList.toggle("no",!g);if(g)n++});return n},
    report(){return rows.map(r=>({ok:ok(r),line:`${r.it.before}${r.val||"___"}${r.it.after}   (correct: ${r.it.correct})`}))},
    fill(){rows.forEach(r=>{r.val=r.it.correct;r.pills.forEach(p=>p.classList.toggle("sel",p.textContent===r.it.correct))})}
  };
}

function mailTask(body){
  body.innerHTML="";
  const intro=el("div","mail");
  intro.innerHTML="<b>From:</b> Bella &nbsp; <b>To:</b> Alice &nbsp; <b>Subject:</b> I don't know what to do";
  body.appendChild(intro);
  const gaps=[]; const paras=[];
  MAIL.forEach(p=>{
    const node=el("div","para"+(p.plain?" plain":""));
    const pr={node,gaps:[],plain:!!p.plain,segs:[]};
    let last=0;const re=/\[([^|\]]+)\|([^\]]+)\]/g;let m;
    while((m=re.exec(p.t))){
      const txt=p.t.slice(last,m.index);
      node.appendChild(document.createTextNode(txt));pr.segs.push({text:txt});
      const inp=document.createElement("input");inp.type="text";inp.autocomplete="off";inp.autocapitalize="off";inp.spellcheck=false;
      node.appendChild(inp);
      const h=el("span","hint");h.textContent="("+m[2]+")";node.appendChild(h);
      const g={inp,ans:m[1],para:pr};pr.gaps.push(g);gaps.push(g);pr.segs.push({gap:g});
      last=m.index+m[0].length;
    }
    const tail=p.t.slice(last);node.appendChild(document.createTextNode(tail));pr.segs.push({text:tail});
    paras.push(pr);body.appendChild(node);
  });
  const ok=g=>norm(g.inp.value)===g.ans;
  return {
    total:gaps.length,
    check(){let n=0;
      gaps.forEach(g=>{const o=ok(g);g.inp.style.borderColor=o?"#2e9e4f":"#d8493a";if(o)n++});
      paras.forEach(pr=>{if(pr.plain)return;const all=pr.gaps.every(ok);pr.node.classList.toggle("ok",all);pr.node.classList.toggle("no",!all)});
      return n},
    report(){return gaps.map(g=>{
      const line=g.para.segs.map(s=>s.text!==undefined?s.text:(s.gap===g?(g.inp.value.trim()||"___"):s.gap.ans)).join("");
      return {ok:ok(g),line:plain(line)+`   (correct: ${g.ans})`};})},
    fill(){gaps.forEach(g=>{g.inp.value=g.ans})}
  };
}

/* ---------- SECTIONS ---------- */
const DEFS=[
 {label:"Rules",ins:"Complete the rules. Choose the correct words from the list.",acc:"#3e6a6d",build:ruleTask},
 {label:"Choose the correct form",ins:"Click the correct comparative or superlative.",acc:"#7a3fb0",build:chooseTask},
 {label:"Complete Bella's email",ins:"Remember Bella's email from the lesson. Write the correct form of the word in brackets. Use your memory first, then check.",acc:"#c2410c",build:mailTask}
];
const sections=[];
const tasksEl=document.getElementById("tasks");
DEFS.forEach((d,i)=>{
  const card=el("div","card");card.style.setProperty("--acc",d.acc);
  card.innerHTML=`<h2>Task ${i+1}. ${d.label}</h2><p class="ins">${d.ins}</p>`;
  const body=el("div");card.appendChild(body);
  const btns=el("div","btns");
  const bc=el("button","b");bc.textContent="Check";
  const bs=el("button","b alt");bs.textContent="Show answers";
  const bt=el("button","b alt");bt.textContent="Try again";
  const sc=el("span","score");const ms=el("span","msg");
  btns.append(bc,bs,bt,sc,ms);card.appendChild(btns);tasksEl.appendChild(card);
  const sec={num:i+1,label:d.label,total:0,score:0,checked:false,revealed:false,api:null,log:[],seen:new Set(),lastOk:[]};
  const render=()=>{sec.api=d.build(body);sec.total=sec.api.total;sec.score=0;sec.checked=false;sec.revealed=false;sc.textContent="";ms.textContent="";updateBar()};
  render();
  bc.onclick=()=>{
    if(sec.revealed){ms.textContent="Answers are shown. Press Try again to practise.";return}
    sec.score=sec.api.check();sec.checked=true;record(sec);
    sc.textContent=sec.score+" / "+sec.total;ms.textContent=sec.score===sec.total?"Perfect! 🎉":"Fix the red parts and press Check again.";
    updateBar();
  };
  bs.onclick=()=>{sec.api.fill();sec.revealed=true;sec.score=0;sc.textContent="";ms.textContent="Answers shown (no score).";updateBar()};
  bt.onclick=render;
  sections.push(sec);
});
function record(sec){
  sec.api.report().forEach((r,i)=>{
    sec.lastOk[i]=r.ok;
    if(!r.ok){const k=i+"|"+r.line;if(!sec.seen.has(k)){sec.seen.add(k);sec.log.push({i,line:r.line})}}
  });
}
function updateBar(){
  const tot=sections.reduce((a,s)=>a+s.total,0);
  const got=sections.reduce((a,s)=>a+(s.checked&&!s.revealed?s.score:0),0);
  document.getElementById("prog").textContent=got+" / "+tot;
  document.getElementById("fill").style.width=(tot?got/tot*100:0)+"%";
}
function buildReport(){
  const name=document.getElementById("stuName").value.trim()||"(no name)";
  let out=`Team Edward vs Team Jacob – Comparatives and Superlatives Homework – ${name} (${new Date().toLocaleString()})\n\n`;
  let got=0,tot=0;
  sections.forEach(s=>{
    tot+=s.total;
    let st;
    if(s.revealed)st="answers shown";
    else if(!s.checked)st="not checked";
    else{st=s.score+" / "+s.total;got+=s.score}
    out+=`Task ${s.num} ${s.label}: ${st}\n`;
  });
  out+=`Total: ${got} / ${tot}\n\nMISTAKES (every wrong answer, including ones fixed on retry)\n`;
  let any=false;
  sections.forEach(s=>{
    if(!s.log.length)return;
    any=true;
    out+=`\nTask ${s.num} ${s.label}\n`;
    s.log.forEach(e=>{out+=`  ✗ ${e.line}   [${s.lastOk[e.i]?"fixed on retry":"still wrong"}]\n`});
  });
  if(!any)out+="\nNo mistakes recorded.\n";
  return out;
}
window.HW={sections,buildReport};
document.getElementById("copyBtn").onclick=()=>{
  const t=buildReport(),m=document.getElementById("copyMsg");
  const fb=()=>{const a=document.createElement("textarea");a.value=t;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(e){}a.remove();m.textContent="Copied! Paste it in the chat."};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>{m.textContent="Copied! Paste it in the chat."},fb)}else fb();
};
</script>
</body>
</html>
