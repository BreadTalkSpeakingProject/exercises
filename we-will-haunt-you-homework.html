<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>We Will Haunt You! homework</title>
<style>
:root{--bg:#1f1a2e;--card:#2a2340;--ink:#f4efe6;--mut:#b9b0cf;--ok:#3ecf8e;--bad:#ff6b6b;--line:#443b66}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Poppins,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.5}
.wrap{max-width:820px;margin:0 auto;padding:16px 16px 80px}
h1{font-size:1.7rem;margin:.4em 0 .1em}
.sub{color:var(--mut);margin:0 0 14px}
#bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}
#bar .track{flex:1;height:10px;background:var(--line);border-radius:6px;overflow:hidden}
#bar .fill{height:100%;width:0;background:linear-gradient(90deg,#ff9a3c,#ffcf5c);transition:width .3s}
#bar b{white-space:nowrap}
.name{margin:14px 0}
input[type=text],textarea{width:100%;background:#17132a;color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit}
.card{background:var(--card);border-radius:18px;padding:18px;margin:18px 0;border-top:6px solid var(--ac,#ff9a3c)}
.card h2{margin:0 0 4px;font-size:1.15rem}
.card h2 span{color:var(--ac);margin-right:6px}
.instr{color:var(--mut);margin:0 0 12px;font-size:.95rem}
.note{background:#17132a;border-radius:12px;padding:10px 14px;margin:0 0 12px;font-size:.92rem}
.note b{color:var(--ac)}.note{border-left:5px solid var(--ac);line-height:1.8}
.item{padding:10px 12px;border-radius:12px;margin:8px 0;background:#241d3a;border:2px solid transparent}
.item.ok{border-color:var(--ok)}.item.no{border-color:var(--bad)}
.n{display:inline-block;min-width:1.6em;color:var(--ac);font-weight:700}
.pills{display:inline-flex;flex-wrap:wrap;gap:6px;margin:2px 4px;vertical-align:middle}
.pill{background:#17132a;color:var(--ink);border:2px solid var(--line);border-radius:20px;padding:3px 12px;cursor:pointer;font:inherit;font-size:.92rem}
.pill.sel{border-color:var(--ac);background:#3a3060}
.pill.right{border-color:var(--ok);background:#1d4a38}.pill.wrong{border-color:var(--bad);background:#552a35}
select.dd{background:#17132a;color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:3px 6px;font:inherit;font-size:.92rem;margin:2px 4px;max-width:100%}select.dd.right{border-color:var(--ok);background:#1d4a38}select.dd.wrong{border-color:var(--bad);background:#552a35}
.gap{display:inline-block;padding:1px 6px;margin:0 3px;border-radius:6px;text-align:center;font-size:.95rem}
.gap.ok{border-color:var(--ok)}.gap.no{border-color:var(--bad)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.btn{background:var(--ac,#ff9a3c);color:#1b1530;border:0;border-radius:10px;padding:8px 16px;font:inherit;font-weight:700;cursor:pointer}
.btn.sec{background:transparent;color:var(--ink);border:2px solid var(--line)}
.res{font-weight:700;margin-left:6px}
.bank{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.bank span{background:#17132a;border:2px solid var(--ac);border-radius:8px;padding:2px 10px;font-size:.92rem}
.check li{color:var(--mut)}.check li.y{color:var(--ok)}
iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;background:#000}
#copy{font-size:1.05rem;padding:12px 22px}
#msg{color:var(--ok);margin-left:10px}
a{color:#ffcf5c}
</style></head>
<body><div class="wrap">
<h1>👻 We Will Haunt You! homework</h1>
<p class="sub">will and would beyond the future · special focus: will have + V3 (a guess about the past)</p>
<div id="bar"><div class="track"><div class="fill" id="fill"></div></div><b id="score">0 / 0</b></div>
<div class="name"><input type="text" id="who" placeholder="Your name"></div>
<div id="root"></div>
<div class="btns"><button class="btn" id="copy">Copy my results</button><span id="msg"></span></div>
</div>
<script>
const ACC=["#ff9a3c","#b48cff","#4cc9f0","#ff6fa5","#7ddc7d","#ffcf5c","#ff8a5c","#9ad1ff"];
const SECS=[
{num:"1",title:"Will have done: past or future?",type:"choice",ac:0,shuf:true,
 instr:"Read the sentence and decide what it is about.",
 note:"<b>KEY RULE.</b> <b>will have + V3</b> has two jobs:<br>① <b>a guess about the PAST</b>: I can't check, but I'm sure. <i>You’ll have heard of this movie. (= I bet you’ve heard.)</i><br>② <b>done before a point in the FUTURE</b>: <i>By Friday I’ll have finished.</i><br>Clues for ①: <i>no doubt, I bet, I’m sure, by now, already, last night</i>. Clues for ②: <i>by Friday, by the time we arrive, before next week</i>.",
 items:[
 "It’s 11 p.m. The shop will have closed by now. → {a guess about the past*|the future}",
 "By next Friday I’ll have finished the report. → {a guess about the past|the future*}",
 "Don’t call Anna, she’ll have gone to bed already. → {a guess about the past*|the future}",
 "The guests will have arrived before we get there. → {a guess about the past|the future*}",
 "You’ll have noticed the strange noise last night. It was so loud! → {a guess about the past*|the future}",
 "By the time you call, the tickets will have sold out. → {a guess about the past|the future*}"
 ]},
{num:"2",title:"Write: will have + V3",type:"gap",ac:1,
 instr:"Make a guess about the past. Write will have + the verb in brackets (a short form like 'll have is fine).",
 items:[
 "It’s midnight. The party [will have finished/'ll have finished] by now. (finish)",
 "He isn’t answering his phone. He [will have forgotten/'ll have forgotten] it at home again. (forget)",
 "You [will have noticed/'ll have noticed] the noise last night, it was so loud! (notice)",
 "I can’t see the ghost anywhere. It [will have run/'ll have run] away when we turned on the light. (run)",
 "The kids [will have eaten/'ll have eaten] all the candy by now, I’m sure. (eat)",
 "She [will have seen/'ll have seen] this film before, she loves horror. (see)"
 ]},
{num:"3",title:"Which form?",type:"choice",ac:2,shuf:true,
 instr:"Choose the correct form. Think: is it about now, the past, a habit, or a refusal?",
 items:[
 "The lights are off and nobody answers. They {will have gone*|will go|would go} to bed already.",
 "I can’t find my keys. I {will have left*|will leave|would leave} them in the car.",
 "It’s 9 a.m. Tom is always at his desk now, so he {will be working*|will have worked|would work} at the moment.",
 "My sister {will have told*|will be telling|would tell} everyone the ending by now. She can’t keep secrets.",
 "When I was little, we {will|would*|will have} spend every summer at my grandma’s.",
 "The old car {wouldn’t*|won’t have|won’t} start yesterday, however hard I tried."
 ]},
{num:"4",title:"What does it express?",type:"choice",dd:true,ac:3,
 instr:"Choose what each sentence expresses. Two of the options are always wrong.",
 items:[
 "When we were kids, we would build a snow fortress every winter. → {a past habit*|an annoying habit|a guess about now|a guess about the past|a refusal}",
 "Rob will talk about his cat for hours. Nobody can stop him. → {a past habit|an annoying habit*|a guess about now|a guess about the past|a refusal}",
 "It’s 9 p.m., so Kate will be walking her dogs. → {a past habit|an annoying habit|a guess about now*|a guess about the past|a refusal}",
 "You’ll have heard the news already, I’m sure. → {a past habit|an annoying habit|a guess about now|a guess about the past*|a refusal}",
 "I asked him three times, but he wouldn’t listen. → {a past habit|an annoying habit|a guess about now|a guess about the past|a refusal*}",
 "They’ll have missed the last train. It left at midnight. → {a past habit|an annoying habit|a guess about now|a guess about the past*|a refusal}"
 ]},
{num:"5",title:"Say it with will",type:"choice",ac:4,shuf:true,
 instr:"Choose the best way to say the same thing with will or would.",
 items:[
 "I bet she forgot about the meeting. → {She will have forgotten about the meeting.*|She will forget about the meeting.|She would forget about the meeting.}",
 "I’m sure Rob is sleeping now. → {Rob will be sleeping now.*|Rob will have slept now.|Rob would sleep now.}",
 "He always interrupts me, and it’s so annoying. → {He will always interrupt me.*|He will always have interrupted me.|He would always interrupt me now.}",
 "When I was a student, I often studied in cafés. → {I would often study in cafés.*|I will often study in cafés.|I would often have studied in cafés.}",
 "Surely you read this book at school. → {You will have read this book at school.*|You will read this book at school.|You would read this book at school.}",
 "The washing machine refused to work yesterday. → {The washing machine wouldn’t work yesterday.*|The washing machine won’t have worked yesterday.|The washing machine won’t work yesterday.}"
 ]},
{num:"6",title:"Past habits: would or used to?",type:"choice",ac:6,shuf:true,
 instr:"Choose the correct form for a habit in the past.",
 note:"<b>would</b> = repeated actions in the past (<i>every Sunday we would visit my gran</i>). For states (be, live, have, love, hate) we say <b>used to</b>, not would: <i>I used to live in Kazan.</i>",
 items:[
 "Every summer we {would*|will|are} rent a cabin by the lake.",
 "I {would|used to*|will} be afraid of the dark when I was little.",
 "My dad {would*|will|had} wake us up with loud music on Saturday mornings.",
 "We {would|used to*|will} live in a tiny village before we moved to the city.",
 "Every evening my grandmother {would*|will|used} sit on the porch and tell us ghost stories.",
 "I {would|used to*|will} hate broccoli, but now I love it."
 ]},
{num:"7",title:"Annoying habits and typical behaviour: will",type:"choice",ac:7,shuf:true,
 instr:"Choose will or would. Is the habit about now or about the past?",
 note:"<b>will</b> = typical or annoying behaviour <b>now</b>: <i>He will always leave the door open. It drives me crazy!</i> About the <b>past</b> we use <b>would</b>: <i>When he was younger, he would always leave the door open.</i>",
 items:[
 "My neighbour {will*|would|did} always play loud music at midnight. It drives me crazy!",
 "Babies {will*|would|are} cry when they are hungry.",
 "He {will*|would|did} sit for hours in front of the TV, and nothing can stop him.",
 "When my brother was younger, he {would*|will|did} always borrow my clothes without asking.",
 "Every year my aunt {will*|would|had} send me a ridiculous sweater for Christmas, and I never know what to say.",
 "Accidents {will*|would|did} happen, so don’t worry."
 ]},
{num:"8",title:"Refusals: won’t or wouldn’t?",type:"choice",ac:0,shuf:true,
 instr:"Choose the correct form. Look at the time clue.",
 note:"<b>won’t</b> = refuses (now). <b>wouldn’t</b> = refused (past). It works for people and for things: <i>the door won’t open</i>, <i>the car wouldn’t start this morning</i>.",
 items:[
 "Right now the printer is broken and it {won’t*|wouldn’t|hasn’t} print anything.",
 "Last night my laptop {wouldn’t*|won’t|hasn’t} turn on, so I couldn’t finish my homework.",
 "I’ve asked him politely, but at the moment he {won’t*|wouldn’t|hasn’t} listen to anyone.",
 "When I was a teenager, I {wouldn’t*|won’t|haven’t} eat vegetables however hard my mum tried.",
 "The door is stuck. It just {won’t*|wouldn’t|hasn’t} open!",
 "The kids were tired, but they {wouldn’t*|won’t|haven’t} go to bed yesterday."
 ]},
{num:"9",title:"Write: will, would, won’t, wouldn’t",type:"gap",ac:1,
 bank:["will","would","won’t","wouldn’t"],
 instr:"Type the missing word from the box. You can use a word more than once.",
 items:[
 "When I was little, my brother [would] always hide under the table when guests came.",
 "Don’t ask him for help, he [won’t/will not] listen.",
 "My cat [will] sit on my keyboard whenever I try to work. It’s so annoying!",
 "I begged her to stay, but she [wouldn’t/would not] change her mind.",
 "Every Sunday my grandfather [would] tell us stories about the old days.",
 "The window is stuck: it [won’t/will not] close."
 ]},
{num:"10",title:"Your turn: write",type:"write",ac:5,
 instr:"Write 6–8 sentences. (a) Something you or someone you know always does that is annoying. (b) What you would do as a kid. (c) Something that wouldn’t work or someone who wouldn’t listen. (d) A guess about what someone did yesterday, with will have + V3. (Not scored.)"}
];
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const plain=s=>s.replace(/<[^>]*>/g,"");
const norm=s=>s.toLowerCase().replace(/[’‘]/g,"'").replace(/[.!?,;]+$/,"").replace(/\s+/g," ").trim();
const WORDS=/\b(will|'ll) have \w+/gi;

function choiceItem(it,shuf){
  const parts=it.split(/(\{[^}]*\})/),groups=[];
  parts.forEach(p=>{if(p[0]==="{"){let o=p.slice(1,-1).split("|");if(shuf)for(let k=o.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[o[k],o[j]]=[o[j],o[k]]}groups.push({opts:o.map(x=>x.replace("*","")),ans:o.findIndex(x=>x.includes("*")),sel:-1})}});
  return {parts,groups};
}
function lineOf(c){
  let gi=0;const s=c.parts.map(p=>{if(p[0]!=="{")return p;const g=c.groups[gi++];return g.sel<0?"___":g.opts[g.sel]}).join("");
  const wr=c.groups.filter(g=>g.sel!==g.ans).map(g=>g.opts[g.ans]);
  return {ok:!wr.length,line:s+(wr.length?"   (correct: "+wr.join("; ")+")":"")};
}
function build(sec,box){
  const st={};
  if(sec.d.type==="choice"){
    const L=sec.d.items.map(it=>typeof it==="string"?{c:choiceItem(it,sec.d.dd||sec.d.shuf)}:{tf:it});
    const render=()=>{
      box.innerHTML=L.map((o,i)=>{
        if(o.c){let gi=0;const h=o.c.parts.map(p=>{if(p[0]!=="{")return esc(p);const g=gi++;if(sec.d.dd)return `<select class="dd" data-i="${i}" data-g="${g}"><option value="-1">choose…</option>`+o.c.groups[g].opts.map((x,k)=>`<option value="${k}">${esc(x)}</option>`).join("")+`</select>`;return `<span class="pills">`+o.c.groups[g].opts.map((x,k)=>`<button class="pill" data-i="${i}" data-g="${g}" data-k="${k}">${esc(x)}</button>`).join("")+`</span>`}).join("");
          return `<div class="item" id="${sec.id}-${i}"><span class="n">${i+1}.</span>${h}</div>`}
        return `<div class="item" id="${sec.id}-${i}"><span class="n">${i+1}.</span>${esc(o.tf.tf)} <span class="pills"><button class="pill" data-i="${i}" data-k="1">True</button><button class="pill" data-i="${i}" data-k="0">False</button></span></div>`}).join("");
    };
    const paint=(show)=>{
      L.forEach((o,i)=>{const it=$("#"+sec.id+"-"+i);it.classList.remove("ok","no");
        it.querySelectorAll("select").forEach(sl=>{sl.value=o.c.groups[+sl.dataset.g].sel;sl.classList.remove("right","wrong")});
        it.querySelectorAll(".pill").forEach(b=>{b.classList.remove("sel","right","wrong");const k=+b.dataset.k;
          if(o.c){const g=o.c.groups[+b.dataset.g];if(g.sel===k)b.classList.add("sel")}else{if(o.sel===(k===1))b.classList.add("sel")}})});
    };
    const mark=()=>{L.forEach((o,i)=>{const it=$("#"+sec.id+"-"+i);const ok=o.c?lineOf(o.c).ok:o.sel===o.tf.a;it.classList.add(ok?"ok":"no");
      it.querySelectorAll("select").forEach(sl=>{const g=o.c.groups[+sl.dataset.g];sl.classList.add(g.sel===g.ans?"right":"wrong")});
      it.querySelectorAll(".pill").forEach(b=>{const k=+b.dataset.k;if(o.c){const g=o.c.groups[+b.dataset.g];if(g.sel===k)b.classList.add(g.sel===g.ans?"right":"wrong")}else if(o.sel===(k===1))b.classList.add(o.sel===o.tf.a?"right":"wrong")})})};
    box.onclick=e=>{const b=e.target.closest(".pill");if(!b||sec.revealed)return;const i=+b.dataset.i,o=L[i];
      if(o.c)o.c.groups[+b.dataset.g].sel=+b.dataset.k;else o.sel=b.dataset.k==="1";paint();};
    box.onchange=e=>{const sl=e.target.closest("select");if(!sl||sec.revealed)return;L[+sl.dataset.i].c.groups[+sl.dataset.g].sel=+sl.value};
    render();
    return {total:L.length,
      check(){mark();return L.filter(o=>o.c?lineOf(o.c).ok:o.sel===o.tf.a).length},
      report(){return L.map(o=>o.c?lineOf(o.c):{ok:o.sel===o.tf.a,line:`"${o.tf.tf}" – you chose ${o.sel===undefined?"nothing":o.sel?"True":"False"}; correct: ${o.tf.a?"True":"False"}`+(o.tf.fix?" ("+o.tf.fix+")":"")})},
      fill(){L.forEach(o=>{if(o.c)o.c.groups.forEach(g=>g.sel=g.ans);else o.sel=o.tf.a});paint();mark()}};
  }
  if(sec.d.type==="gap"){
    const L=sec.d.items.map(s=>{const m=s.match(/\[([^\]]+)\]/);return {pre:s.slice(0,m.index),post:s.slice(m.index+m[0].length),ans:m[1].split("/")[0]+(m[1].includes("/")?"/"+m[1].split("/").slice(1).join("/"):"")}});
    const bk=sec.d.bank?sec.d.bank.slice():null;if(bk)for(let k=bk.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[bk[k],bk[j]]=[bk[j],bk[k]]}
    box.innerHTML=(bk?`<div class="bank">`+bk.map(w=>`<span>${w}</span>`).join("")+`</div>`:"")+L.map((o,i)=>`<div class="item" id="${sec.id}-${i}"><span class="n">${i+1}.</span>${esc(o.pre)}<input type="text" class="gap" style="width:${o.ans.split("/")[0].length+3}ch" placeholder="${o.ans[0]}…" autocomplete="off" autocapitalize="off" spellcheck="false" data-i="${i}">${esc(o.post)}</div>`).join("");
    const val=i=>box.querySelectorAll(".gap")[i].value;
    const okf=i=>L[i].ans.split("/").some(a=>norm(val(i))===norm(a));
    return {total:L.length,
      check(){let n=0;L.forEach((o,i)=>{const ok=okf(i);if(ok)n++;const it=$("#"+sec.id+"-"+i);it.classList.remove("ok","no");it.classList.add(ok?"ok":"no")});return n},
      report(){return L.map((o,i)=>{const v=val(i).trim();return {ok:okf(i),line:o.pre+(v||"___")+o.post+(okf(i)?"":"   (correct: "+o.ans.split("/")[0]+")")}})},
      fill(){L.forEach((o,i)=>box.querySelectorAll(".gap")[i].value=o.ans.split("/")[0]);this.check()}};
  }
  if(sec.d.type==="write"){
    box.innerHTML=`<textarea rows="7" id="wr" placeholder="Write here..."></textarea><ul class="check" id="ck"><li data-k="s">6 or more sentences</li><li data-k="w">4 or more uses of will, would, won\'t or wouldn\'t</li><li data-k="h">one will have + V3 sentence</li></ul>`;
    const ta=$("#wr",box);const info=()=>{const t=ta.value;const sn=(t.match(/[^.!?]+[.!?]+/g)||[]).length;const t2=t.replace(/’/g,"'");const w=(t2.match(/\b(will|would|won't|wouldn't|'ll)\b|\bwon't|\bwouldn't|'ll\b/gi)||[]).length;const h=(t2.match(WORDS)||[]).length;
      $("[data-k=s]",box).classList.toggle("y",sn>=6);$("[data-k=w]",box).classList.toggle("y",w>=4);$("[data-k=h]",box).classList.toggle("y",h>=1)};
    ta.oninput=info;
    return {total:0,check(){return 0},report(){return []},fill(){},text:()=>ta.value.trim()};
  }
}
const root=$("#root");
const S=SECS.map((d,idx)=>{
  const sec=Object.assign({id:"t"+d.num,score:0,checked:false,revealed:false,log:[],seen:new Set(),lastOk:[]},{d});
  const card=document.createElement("section");card.className="card";card.style.setProperty("--ac",ACC[d.ac]);
  card.innerHTML=`<h2><span>${d.num}</span>${d.title}</h2><p class="instr">${d.instr}</p>`+
   (d.video?`<div class="note"><iframe src="https://www.youtube-nocookie.com/embed/R-VRAemIvbI?start=17" allowfullscreen title="Halloween video"></iframe><p style="margin:8px 0 0">Can't see it? <a href="https://www.youtube.com/watch?v=R-VRAemIvbI&t=17s" target="_blank" rel="noopener">Open the video on YouTube</a>.</p></div>`:"")+
   (d.note?`<div class="note">${d.note}</div>`:"")+`<div class="body"></div>`+
   (d.type!=="write"?`<div class="btns"><button class="btn" data-a="c">Check</button><button class="btn sec" data-a="s">Show answers</button><button class="btn sec" data-a="r">Try again</button><span class="res"></span></div>`:"");
  root.appendChild(card);
  const boxEl=$(".body",card);
  sec.mount=()=>{sec.api=build(sec,boxEl);sec.api.sec=sec};
  sec.mount();
  const res=$(".res",card);
  card.addEventListener("click",e=>{const a=e.target.dataset&&e.target.dataset.a;if(!a)return;
    if(a==="c"){if(sec.revealed){res.textContent="Answers were shown. Press Try again first.";return}
      sec.score=sec.api.check();sec.checked=true;record(sec);res.textContent=sec.score+" / "+sec.api.total;upd()}
    if(a==="s"){sec.api.fill();sec.revealed=true;sec.checked=false;sec.score=0;res.textContent="Answers shown (no score)";upd()}
    if(a==="r"){sec.mount();sec.revealed=false;sec.checked=false;sec.score=0;res.textContent="";upd()}});
  return sec;
});
function record(sec){
  sec.api.report().forEach((r,i)=>{sec.lastOk[i]=r.ok;if(!r.ok){const k=i+"|"+r.line;if(!sec.seen.has(k)){sec.seen.add(k);sec.log.push({i,line:r.line})}}});
}
function upd(){
  const tot=S.reduce((a,s)=>a+s.api.total,0),got=S.reduce((a,s)=>a+(s.checked&&!s.revealed?s.score:0),0);
  $("#score").textContent=got+" / "+tot;$("#fill").style.width=(tot?got/tot*100:0)+"%";
}
function buildReport(){
  const nm=$("#who").value.trim()||"(no name)";
  let o=`We Will Haunt You! homework – ${nm} (${new Date().toLocaleString()})\n\n`;let T=0,G=0;
  S.forEach(s=>{if(s.d.type==="write")return;const st=s.revealed?"answers shown":s.checked?s.score+" / "+s.api.total:"not checked";
    o+=`Task ${s.d.num} ${s.d.title}: ${st}\n`;T+=s.api.total;if(s.checked&&!s.revealed)G+=s.score});
  o+=`\nTotal: ${G} / ${T}\n\nMISTAKES (every wrong answer, including ones fixed on retry)\n`;
  let any=false;
  S.forEach(s=>{if(!s.log.length)return;any=true;o+=`\nTask ${s.d.num} ${s.d.title}\n`;
    s.log.forEach(e=>{o+=`  ✗ ${e.line}   [${s.lastOk[e.i]?"fixed on retry":"still wrong"}]\n`})});
  if(!any)o+="\n(none)\n";
  const w=S.find(s=>s.d.type==="write");const t=w&&w.api.text();
  o+=`\nWriting:\n${t||"(nothing)"}\n`;return o;
}
window.HW={sections:S,buildReport};
$("#copy").onclick=()=>{const t=buildReport();const done=()=>{$("#msg").textContent="Copied! Paste it in the chat."};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,fb)}else fb();
  function fb(){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(e){}a.remove();done()}};
upd();
</script></body></html>
