<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teenagers scare me – homework</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f9; --card:#fff; --ink:#1f2933; --muted:#667784; --line:#dbe2e8;
  --ok:#1b8a4b; --ok-bg:#e1f5e9; --bad:#c43a3a; --bad-bg:#fbe5e5; --pill:#eef2f6; --soft:#f0f4f8;
  --c1:#0f8a8a; --c2:#e0801f; --c3:#7a5bd6;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#12181d; --card:#1c252c; --ink:#e7edf1; --muted:#9bacb7; --line:#33424c;
    --ok:#62d594; --ok-bg:#183a28; --bad:#ff8b8b; --bad-bg:#432125; --pill:#27343d; --soft:#222d35;
    --c1:#3cc0c0; --c2:#f0a050; --c3:#a58cf0;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Poppins,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{max-width:820px;margin:0 auto;padding:26px 16px 6px}
h1{margin:0 0 4px;font-size:1.6rem}
header p{margin:0 0 12px;color:var(--muted)}
.name{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.name input{font:inherit;padding:7px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);min-width:220px}
.bar{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line);margin-top:10px}
.bar .in{max-width:820px;margin:0 auto;padding:9px 16px;display:flex;align-items:center;gap:12px}
.bar b{white-space:nowrap}
.track{flex:1;height:8px;background:var(--pill);border-radius:99px;overflow:hidden}
.fill{height:100%;width:0;background:var(--c1);transition:width .25s}
main{max-width:820px;margin:0 auto;padding:6px 16px 50px}
.rule{background:var(--soft);border-radius:12px;padding:10px 14px;margin:14px 0;font-size:.93rem}
.rule ul{margin:4px 0 0;padding-left:1.2em}
.card{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--acc);border-radius:14px;padding:16px 18px;margin:18px 0}
.card h2{margin:0 0 4px;font-size:1.1rem;display:flex;gap:10px;align-items:center}
.badge{background:var(--acc);color:#fff;border-radius:99px;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;font-size:.9rem}
.card .ins{margin:0 0 10px;color:var(--muted);font-size:.93rem}
ol.items{margin:0;padding:0;list-style:none;counter-reset:i}
ol.items li{counter-increment:i;padding:8px 8px 8px 2.1em;position:relative;border-radius:8px;margin:2px 0}
ol.items li::before{content:counter(i);position:absolute;left:.4em;top:8px;color:var(--acc);font-weight:600}
ol.items li.ok{background:var(--ok-bg)}
ol.items li.bad{background:var(--bad-bg)}
input.g{font:inherit;padding:2px 8px;border:1.5px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink);width:15em;max-width:100%;margin:2px 4px}
input.g.ok{border-color:var(--ok);background:var(--ok-bg)}
input.g.bad{border-color:var(--bad);background:var(--bad-bg)}
input.g:focus{outline:2px solid var(--acc);outline-offset:1px}
.hint{color:var(--muted);font-size:.9rem;margin-right:4px}
.pill{font:inherit;font-size:.93rem;border:1.5px solid var(--line);background:var(--pill);color:var(--ink);border-radius:99px;padding:2px 13px;margin:2px 3px;cursor:pointer}
.pill.on{border-color:var(--acc);background:var(--acc);color:#fff}
.pill.ok{border-color:var(--ok);background:var(--ok);color:#fff}
.pill.bad{border-color:var(--bad);background:var(--bad);color:#fff}
.mark{font-weight:700;margin-left:4px}
li.ok .mark{color:var(--ok)}li.bad .mark{color:var(--bad)}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
button.b{font:inherit;font-weight:500;cursor:pointer;border-radius:9px;padding:6px 14px;border:1.5px solid var(--acc);background:transparent;color:var(--acc)}
button.b.main{background:var(--acc);color:#fff}
.res{margin-left:auto;font-weight:600}
details.log{margin-top:10px;font-size:.88rem;color:var(--muted)}
details.log div{padding:2px 0}
.copy{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;text-align:center}
.copy button{font:inherit;font-weight:600;font-size:1.02rem;padding:10px 22px;border-radius:10px;border:0;background:var(--c1);color:#fff;cursor:pointer}
.copy p{margin:8px 0 0;color:var(--muted);font-size:.92rem}
ol.items li.text{padding-left:8px;line-height:2.1}
ol.items li.text::before{content:none}
ol.items li.text input.g{width:9em;display:inline-block;margin:2px 4px}
.t1{--acc:var(--c1)}.t2{--acc:var(--c2)}.t3{--acc:var(--c3)}
@media(max-width:520px){input.g{width:100%;display:block;margin:4px 0}}

.t4{--acc:var(--c4)}
:root{--c4:#d6498b}
@media (prefers-color-scheme:dark){:root{--c4:#f07ab0}}
ol.items li.pics{padding:4px 0;margin:0}
ol.items li.pics::before{content:none}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.pcell{background:var(--soft);border:2px solid transparent;border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:6px;position:relative}
.pcell img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:8px;display:block}
.pcell select{font:inherit;font-size:.9rem;width:100%;padding:5px 6px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.pcell select.ok{border-color:var(--ok);background:var(--ok-bg)}
.pcell select.bad{border-color:var(--bad);background:var(--bad-bg)}
.pcell.ok{border-color:var(--ok)}.pcell.bad{border-color:var(--bad)}
.pcell .mark{position:absolute;top:10px;right:12px;background:var(--card);border-radius:99px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;margin:0}
.pcell.ok .mark{color:var(--ok)}.pcell.bad .mark{color:var(--bad)}
.wtop{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.wtop img{width:130px;border-radius:12px}
.chk{flex:1;min-width:220px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{border:1.5px solid var(--line);background:var(--pill);border-radius:99px;padding:1px 12px;font-size:.9rem}
.chip.on{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:600}
.stem{margin:10px 0}
.stem label{display:block;font-size:.95rem;margin-bottom:4px}
.stem label b{color:var(--acc);margin-right:4px}
.stem textarea{font:inherit;width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);resize:vertical}
.stem textarea:focus{outline:2px solid var(--acc);outline-offset:1px}
ol.items li.text{line-height:2.1}
@media(max-width:620px){.pgrid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header>
  <h1>Teenagers scare me</h1>
  <p>4 tasks about personality adjectives. Press <b>Check</b> after each one, then <b>Copy my results</b> at the bottom and paste it in the chat.</p>
  <div class="name"><label for="who"><b>Your name:</b></label><input id="who" type="text" placeholder="Type your name" autocomplete="off"></div>
</header>
<div class="bar"><div class="in"><b id="tot">0 / 0</b><div class="track"><div class="fill" id="fill"></div></div></div></div>
<main>
  <div id="tasks"></div>
  <div class="copy"><button id="copyBtn">Copy my results</button><p id="copyMsg">Press it when you have finished, then paste the text in the chat.</p></div>
</main>

/* pictures task */
function buildPics(list){
  const li=document.createElement("li");li.className="pics";
  const grid=document.createElement("div");grid.className="pgrid";
  const sels=[],cells=[];
  PIC_KEY.forEach((k,i)=>{
    const c=document.createElement("div");c.className="pcell";
    c.innerHTML='<img src="'+IMG[i]+'" alt="Picture '+(i+1)+'"><select aria-label="Picture '+(i+1)+'"><option value="">choose…</option>'+ADJ.map(a=>"<option>"+a+"</option>").join("")+'</select><span class="mark"></span>';
    const s=c.querySelector("select");
    s.addEventListener("change",()=>{c.classList.remove("ok","bad");s.classList.remove("ok","bad");c.querySelector(".mark").textContent="";});
    grid.appendChild(c);sels.push(s);cells.push(c);
  });
  li.appendChild(grid);list.appendChild(li);
  const okAt=i=>sels[i].value===PIC_KEY[i];
  return {
    check(){let n=0;PIC_KEY.forEach((k,i)=>{const ok=okAt(i);if(ok)n++;
      cells[i].classList.toggle("ok",ok);cells[i].classList.toggle("bad",!ok);
      sels[i].classList.toggle("ok",ok);sels[i].classList.toggle("bad",!ok);
      cells[i].querySelector(".mark").textContent=ok?"✓":"✗";});return n;},
    report(){return PIC_KEY.map((k,i)=>({ok:okAt(i),line:"Picture "+(i+1)+": you chose "+(sels[i].value?'"'+sels[i].value+'"':"nothing")+"; correct: "+k}));},
    fill(){PIC_KEY.forEach((k,i)=>{sels[i].value=k;cells[i].classList.remove("ok","bad");sels[i].classList.remove("ok","bad");cells[i].querySelector(".mark").textContent="";});}
  };
}

function buildWrite(list){
  const li=document.createElement("li");li.className="pics";
  const top=document.createElement("div");top.className="wtop";
  top.innerHTML='<img src="'+IMG_EXTRA+'" alt="A thoughtful young man"><div class="chk"><b>Checklist: <span class="cn">0</span> / 8 words used</b><div class="chips">'+ADJ.map(a=>'<span class="chip">'+a+'</span>').join("")+'</div></div>';
  li.appendChild(top);
  const tas=[];
  STEMS.forEach((s,i)=>{
    const d=document.createElement("div");d.className="stem";
    d.innerHTML='<label><b>'+(i+1)+'</b> '+esc(s)+'</label><textarea rows="2" placeholder="Write your idea here"></textarea>';
    tas.push(d.querySelector("textarea"));li.appendChild(d);
  });
  list.appendChild(li);
  const chips=[...li.querySelectorAll(".chip")];
  const upd=()=>{const all=tas.map(t=>t.value.toLowerCase().replace(/[’‘`]/g,"'")).join(" ");let n=0;
    CHECK_RE.forEach((re,i)=>{const u=re.test(all);if(u)n++;chips[i].classList.toggle("on",u);});
    li.querySelector(".cn").textContent=n;return n;};
  tas.forEach(t=>t.addEventListener("input",upd));
  return {
    check(){return 0;},report(){return [];},fill(){},
    extra(){const out=[];STEMS.forEach((s,i)=>{const v=tas[i].value.trim();if(v)out.push((i+1)+". "+s+" "+v);});
      if(out.length)out.push("Checklist: "+upd()+" / 8 words used");return out;}
  };
}

/* ---------------- HELPERS ---------------- */
function parseChoice(str){
  const parts=[],groups=[],re=/\{([^}]*)\}/g;let last=0,m;
  while((m=re.exec(str))){
    parts.push({t:str.slice(last,m.index)});
    const opts=m[1].split("|").map(o=>({text:o.replace(/\*$/,""),ok:/\*$/.test(o)}));
    const g={opts,sel:-1};groups.push(g);parts.push({g});last=re.lastIndex;
  }
  parts.push({t:str.slice(last)});
  return {parts,groups};
}
function choiceLine(it){
  const txt=it.parts.map(p=>p.g?(p.g.sel>=0?p.g.opts[p.g.sel].text:"___"):p.t).join("");
  const wrong=it.groups.filter(g=>!(g.sel>=0&&g.opts[g.sel].ok));
  if(!wrong.length) return txt;
  return txt+"   (correct: "+wrong.map(g=>g.opts.filter(o=>o.ok).map(o=>o.text).join(" / ")).join("; ")+")";
}
const choiceOk=it=>it.groups.every(g=>g.sel>=0&&g.opts[g.sel].ok);

const tasksEl=document.getElementById("tasks");

function makeSection(cfg){
  const sec={unscored:!!cfg.unscored,id:cfg.id,num:cfg.num,label:cfg.label,total:cfg.total,score:0,checked:false,revealed:false,api:null,log:[],seen:new Set(),lastOk:[]};
  const card=document.createElement("section");
  card.className="card t"+cfg.num;
  card.innerHTML=`<h2><span class="badge">${cfg.num}</span>${esc(cfg.label)}</h2><p class="ins">${cfg.ins}</p><ol class="items"></ol>
  <div class="btns"><button class="b main" data-a="check">Check</button><button class="b" data-a="show">Show answers</button><button class="b" data-a="retry">Try again</button><span class="res"></span></div>
  <details class="log"><summary>Mistakes logged: <span class="n">0</span></summary><div class="lines"></div></details>`;
  tasksEl.appendChild(card);
  const list=card.querySelector("ol.items"),res=card.querySelector(".res");
  if(cfg.unscored){card.querySelector(".btns").style.display="none";card.querySelector("details.log").style.display="none";}
  sec.render=()=>{list.innerHTML="";sec.api=cfg.build(list);};
  sec.setRes=t=>{res.textContent=t;};
  sec.updateLog=()=>{
    card.querySelector(".n").textContent=sec.log.length;
    card.querySelector(".lines").innerHTML=sec.log.map(e=>`<div>✗ ${esc(e.line)}</div>`).join("");
  };
  card.addEventListener("click",e=>{
    const a=e.target.dataset&&e.target.dataset.a;if(!a)return;
    if(a==="check"){
      if(sec.revealed){sec.setRes("Press Try again first");return;}
      sec.score=sec.api.check();sec.checked=true;record(sec);
      sec.setRes(sec.score+" / "+sec.total);
    }else if(a==="show"){
      sec.api.fill();sec.revealed=true;sec.checked=false;sec.score=0;sec.setRes("Answers shown (no score)");
    }else if(a==="retry"){
      sec.render();sec.checked=false;sec.revealed=false;sec.score=0;sec.setRes("");
    }
    updateBar();
  });
  sec.render();sections.push(sec);return sec;
}
function record(sec){
  sec.api.report().forEach((r,i)=>{
    sec.lastOk[i]=r.ok;
    if(!r.ok){const k=i+"|"+r.line;if(!sec.seen.has(k)){sec.seen.add(k);sec.log.push({i,line:r.line});}}
  });
  sec.updateLog();
}
function updateBar(){
  const tot=sections.reduce((s,x)=>s+x.total,0);
  const got=sections.reduce((s,x)=>s+(x.checked&&!x.revealed?x.score:0),0);
  document.getElementById("tot").textContent=got+" / "+tot;
  document.getElementById("fill").style.width=(tot?got/tot*100:0)+"%";
}

/* gap task */
function buildGap(items){
  return list=>{
    const inputs=[],lis=[];
    items.forEach(it=>{
      const li=document.createElement("li");
      li.innerHTML=`<span>${esc(it.pre)}</span><input class="g" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="answer"><span class="hint">${esc(it.hint)}</span><span>${esc(it.post)}</span><span class="mark"></span>`;
      const inp=li.querySelector("input");
      inp.addEventListener("input",()=>{li.classList.remove("ok","bad");inp.classList.remove("ok","bad");li.querySelector(".mark").textContent="";});
      list.appendChild(li);inputs.push(inp);lis.push(li);
    });
    const okAt=i=>{const v=inputs[i].value.trim();return v!==""&&items[i].ans.some(a=>norm(a)===norm(v));};
    return {
      check(){let n=0;items.forEach((it,i)=>{const ok=okAt(i);if(ok)n++;
        lis[i].classList.toggle("ok",ok);lis[i].classList.toggle("bad",!ok);
        inputs[i].classList.toggle("ok",ok);inputs[i].classList.toggle("bad",!ok);
        lis[i].querySelector(".mark").textContent=ok?"✓":"✗";});return n;},
      report(){return items.map((it,i)=>{const v=inputs[i].value.trim();
        return {ok:okAt(i),line:it.pre+(v||"___")+it.post+"   (correct: "+it.ans[0]+")"};});},
      fill(){items.forEach((it,i)=>{inputs[i].value=it.ans[0];inputs[i].classList.remove("ok","bad");lis[i].classList.remove("ok","bad");lis[i].querySelector(".mark").textContent="";});}
    };
  };
}
/* choice task */
function buildChoice(strs){
  return list=>{
    const its=strs.map(parseChoice),lis=[];
    its.forEach(it=>{
      const li=document.createElement("li");
      it.parts.forEach(p=>{
        if(p.g){
          p.g.btns=p.g.opts.map((o,k)=>{
            const b=document.createElement("button");b.type="button";b.className="pill";b.textContent=o.text;
            b.addEventListener("click",()=>{
              p.g.sel=k;p.g.btns.forEach((x,j)=>x.className="pill"+(j===k?" on":""));
              li.classList.remove("ok","bad");li.querySelector(".mark").textContent="";
            });
            li.appendChild(b);return b;
          });
        }else li.appendChild(document.createTextNode(p.t));
      });
      const m=document.createElement("span");m.className="mark";li.appendChild(m);
      list.appendChild(li);lis.push(li);
    });
    return {
      check(){let n=0;its.forEach((it,i)=>{const ok=choiceOk(it);if(ok)n++;
        lis[i].classList.toggle("ok",ok);lis[i].classList.toggle("bad",!ok);
        lis[i].querySelector(".mark").textContent=ok?"✓":"✗";
        it.groups.forEach(g=>{if(g.sel>=0)g.btns[g.sel].className="pill "+(g.opts[g.sel].ok?"ok":"bad");});});return n;},
      report(){return its.map(it=>({ok:choiceOk(it),line:choiceLine(it)}));},
      fill(){its.forEach((it,i)=>{it.groups.forEach(g=>{const k=g.opts.findIndex(o=>o.ok);g.sel=k;
        g.btns.forEach((x,j)=>x.className="pill"+(j===k?" on":""));});
        lis[i].classList.remove("ok","bad");lis[i].querySelector(".mark").textContent="";});}
    };
  };
}

/* text (cloze) task */
function parseText(sentences){
  const gaps=[];
  const sents=sentences.map(str=>{
    const parts=[],re=/\[([^\]]*)\]/g;let last=0,m;
    while((m=re.exec(str))){
      parts.push({t:str.slice(last,m.index)});
      const bits=m[1].split("|");
      const g={ans:bits[0].split(";"),hint:bits[1]||"",inp:null,mark:null};
      gaps.push(g);parts.push({g});last=re.lastIndex;
    }
    parts.push({t:str.slice(last)});
    return parts;
  });
  return {sents,gaps};
}
function buildText(sentences){
  return list=>{
    const {sents,gaps}=parseText(sentences);
    const li=document.createElement("li");li.className="text";
    sents.forEach(parts=>{
      parts.forEach(p=>{
        if(p.g){
          const inp=document.createElement("input");inp.type="text";inp.className="g";
          inp.setAttribute("autocomplete","off");inp.setAttribute("autocapitalize","off");inp.setAttribute("spellcheck","false");inp.setAttribute("aria-label","answer");
          const h=document.createElement("span");h.className="hint";h.textContent="("+p.g.hint+")";
          const mk=document.createElement("span");mk.className="mark";
          inp.addEventListener("input",()=>{inp.classList.remove("ok","bad");mk.textContent="";});
          p.g.inp=inp;p.g.mark=mk;li.append(inp,h,mk);
        }else li.appendChild(document.createTextNode(p.t));
      });
      li.appendChild(document.createTextNode(" "));
    });
    list.appendChild(li);
    const okG=g=>{const v=g.inp.value.trim();return v!==""&&g.ans.some(a=>norm(a)===norm(v));};
    return {
      check(){let n=0;gaps.forEach(g=>{const ok=okG(g);if(ok)n++;
        g.inp.classList.toggle("ok",ok);g.inp.classList.toggle("bad",!ok);g.mark.textContent=ok?"✓":"✗";});return n;},
      report(){const out=[];
        sents.forEach(parts=>parts.forEach(p=>{if(!p.g)return;
          const line=parts.map(q=>q.g?(q===p?(q.g.inp.value.trim()||"___"):q.g.ans[0]):q.t).join("").trim();
          out.push({ok:okG(p.g),line:line+"   (correct: "+p.g.ans[0]+")"});}));
        return out;},
      fill(){gaps.forEach(g=>{g.inp.value=g.ans[0];g.inp.classList.remove("ok","bad");g.mark.textContent="";});}
    };
  };
}

/* ---------------- REPORT ---------------- */
function statusOf(sec){
  if(sec.unscored)return "writing, not scored";
  if(sec.revealed)return "answers shown";
  if(!sec.checked)return "not checked";
  return sec.score+" / "+sec.total;
}
function buildReport(){
  const name=document.getElementById("who").value.trim()||"(no name)";
  const when=new Date().toLocaleString();
  const tot=sections.reduce((s,x)=>s+x.total,0);
  const got=sections.reduce((s,x)=>s+(x.checked&&!x.revealed?x.score:0),0);
  const L=[];
  L.push("Homework: Teenagers scare me – "+name+" ("+when+")","");
  sections.forEach(s=>L.push("Task "+s.num+" "+s.label+": "+statusOf(s)));
  L.push("Total: "+got+" / "+tot,"","MISTAKES (every wrong answer, including ones fixed on retry)","");
  let any=false;
  sections.forEach(s=>{
    if(!s.log.length)return;any=true;
    L.push("Task "+s.num+" "+s.label);
    s.log.forEach(e=>L.push("  ✗ "+e.line+"   ["+(s.lastOk[e.i]?"fixed on retry":"still wrong")+"]"));
    L.push("");
  });
  if(!any)L.push("No mistakes logged.");
  sections.forEach(s=>{if(s.api&&s.api.extra){const x=s.api.extra();if(x.length){L.push("","Task "+s.num+" "+s.label+" (not scored):");x.forEach(l=>L.push("  "+l));}}});
  return L.join("\n").trim();
}
window.HW={sections,buildReport};
document.getElementById("copyBtn").addEventListener("click",async()=>{
  const text=buildReport(),msg=document.getElementById("copyMsg");
  try{await navigator.clipboard.writeText(text);}
  catch(e){const t=document.createElement("textarea");t.value=text;t.style.position="fixed";t.style.opacity="0";document.body.appendChild(t);t.select();try{document.execCommand("copy");}catch(_){}t.remove();}
  msg.textContent="Copied! Paste it in the chat.";
});
