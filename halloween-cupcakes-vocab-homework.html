<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halloween Cupcakes – Vocabulary Homework</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Karla:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff7ec;--ink:#2b1a12;--muted:#7a6558;--card:#fff;--line:#ecd9c3;--ok:#d9f5df;--okb:#2e9e4f;--no:#fde0dc;--nob:#d8493a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Karla,system-ui,sans-serif;font-size:17px;line-height:1.5}
h1,h2{font-family:"Bricolage Grotesque",Karla,system-ui,sans-serif;margin:0}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 80px}
header{padding:28px 0 10px}
header h1{font-size:30px}
header p{color:var(--muted);margin:6px 0 0}
.name{margin:14px 0}
.name input{font:inherit;padding:9px 12px;border:2px solid var(--line);border-radius:10px;width:100%;max-width:320px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.bar .track{flex:1;height:10px;background:#f1e2cf;border-radius:8px;overflow:hidden}
.bar .fill{height:100%;width:0;background:#f08a1c;transition:width .3s}
.bar b{font-family:"Bricolage Grotesque",sans-serif;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-top:6px solid var(--acc);border-radius:16px;padding:18px;margin:20px 0}
.card h2{font-size:22px;color:var(--acc)}
.card .ins{color:var(--muted);margin:4px 0 14px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;border:2px solid transparent;border-radius:12px;margin:6px 0;background:#fffaf3}
.row.ok{background:var(--ok);border-color:var(--okb)}
.row.no{background:var(--no);border-color:var(--nob)}
.row .w{font-weight:600;min-width:120px}
select,input[type=text]{font:inherit;padding:7px 9px;border:2px solid var(--line);border-radius:9px;background:#fff;max-width:100%}
input[type=text]{width:150px}
select{flex:1;min-width:200px}
.pill{font:inherit;border:2px solid var(--line);background:#fff;border-radius:999px;padding:4px 14px;cursor:pointer;margin:0 3px}
.pill.sel{background:#2b1a12;color:#fff;border-color:#2b1a12}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px;padding:10px;background:#fff1de;border-radius:12px}
.bank span{background:#fff;border:2px dashed #e0b98b;border-radius:999px;padding:2px 12px;font-weight:600}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
button.b{font:inherit;font-weight:600;border:0;border-radius:10px;padding:9px 16px;cursor:pointer;background:var(--acc);color:#fff}
button.b.alt{background:#fff;color:var(--ink);border:2px solid var(--line)}
.score{font-weight:700;margin-left:6px}
.msg{color:var(--muted);font-size:15px}
.final{margin:24px 0;text-align:center}
.final button{font-size:19px;padding:13px 26px}
ol.rec{padding-left:0;list-style:none}
@media(max-width:560px){input[type=text]{width:120px}.row .w{min-width:100%}}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>🎃 Halloween Cupcakes</h1>
<p>Vocabulary homework · A2 · 4 exercises. Press <b>Check</b> in each exercise. At the end, press <b>Copy my results</b> and send them to your teacher.</p>
</header>
<div class="name"><label>Your name: <input id="stuName" type="text" placeholder="Name"></label></div>
<div class="bar"><div class="track"><div class="fill" id="fill"></div></div><b id="prog">0 / 0</b></div>
<div id="tasks"></div>
<div class="final"><button class="b" id="copyBtn" style="background:#2b1a12">Copy my results</button><p class="msg" id="copyMsg"></p></div>
</div>

<script>
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>s.toLowerCase().replace(/[’]/g,"'").replace(/[.!?]+$/,"").replace(/\s+/g," ").trim();
const plain=s=>s.replace(/<[^>]*>/g,"");
const el=(t,c)=>{const e=document.createElement(t);if(c)e.className=c;return e};

/* ---------- DATA ---------- */
const MATCH=[
["oven","A big hot box in the kitchen. You use it to bake food."],
["oven rack","A metal shelf inside the oven."],
["whisk","A kitchen tool for mixing eggs or cream fast."],
["bowl","A deep round dish. You put ingredients in it and mix them."],
["toothpick","A small wooden stick. You use it to check if a cupcake is ready."],
["cupcake liners","Small paper cups. They help you take cupcakes out of the tray."],
["cupcake tray","A metal tray with holes. You put the cupcakes in it to bake them."],
["frosting","A sweet cream you put on top of a cupcake."],
["food coloring","A liquid that changes the colour of food, for example to red or green."]
];
const CHOOSE=[
`A {mummy|ghost*|skull} is a white, scary spirit. It can go through walls.`,
`A {mummy*|ghost|spider} is a dead person with white cloth around the body.`,
`A {bat*|black cat|pumpkin} is a small animal with wings. It flies at night.`,
`A {spiderweb|gravestone*|brain} stands in a cemetery. It has a dead person's name on it.`,
`A spider makes a {spiderweb*|skull|pumpkin} in the corner of the room.`,
`For Halloween, people cut a scary face in a {pumpkin*|brain|eyeball}.`,
`A {skull*|bat|ghost} is the bones of a head. It has no skin.`,
`Fake {blood*|milk|flour} is red and looks scary on a cupcake.`,
`An {eyeball|brain*|skull} is inside your head. You use it to think.`
];
const GAPS3=[
`Soup is a small dish you eat at the start of dinner. It is an [appetizer].`,
`Pizza is my favourite [main course]. I eat it after the starter.`,
`Cupcakes are a sweet [dessert]. I eat them after dinner.`,
`For the party, we need a cold [drink], for example lemonade.`,
`Bread and cupcakes are made with [flour|all-purpose flour]. You mix it with eggs and milk.`,
`I add red [food coloring] to the frosting to make it pink.`,
`I put [powdered sugar] on top of the cupcake. It looks like white snow.`,
`I use [vegetable oil] in the cupcakes. It is a liquid, and it is not butter.`,
`I do not want salty cupcakes, so I use [unsalted butter].`,
`I add one teaspoon of [vanilla extract] to give the cupcakes a sweet smell.`
];
const GAPS4=[
`First, [preheat] the oven to 180°C.`,
`[place|put] 12 paper liners in the cupcake tray.`,
`[microwave] the butter and chocolate for 45 seconds. Do not use the oven!`,
`[whisk|mix] the eggs and milk fast until the mixture is smooth.`,
`[add] the cocoa powder and vanilla to the bowl.`,
`[divide] the mixture between the 12 liners.`,
`[bake] the cupcakes in the oven for 18–20 minutes.`,
`[insert] a toothpick in a cupcake. If it comes out clean, they are ready.`,
`[remove] the cupcakes from the oven.`,
`Let the cupcakes [cool] for 30 minutes.`,
`[decorate] the cupcakes with frosting and a spooky spider.`
];

/* ---------- TASK BUILDERS ---------- */
function matchTask(body){
  const defs=shuffle(MATCH.map(p=>p[1]));
  body.innerHTML="";
  const rows=MATCH.map((p,idx)=>{
    const row=el("div","row");
    const w=el("span","w");w.textContent=p[0];row.appendChild(w);
    const sel=document.createElement("select");
    const o0=document.createElement("option");o0.value="";o0.textContent="— choose the meaning —";sel.appendChild(o0);
    defs.forEach(d=>{const o=document.createElement("option");o.value=d;o.textContent=d;sel.appendChild(o)});
    row.appendChild(sel);
    return {row,sel,p,idx};
  });
  shuffle(rows).forEach(r=>body.appendChild(r.row));
  const ok=r=>r.sel.value===r.p[1];
  return {
    total:rows.length,
    check(){let n=0;rows.forEach(r=>{const g=ok(r);r.row.classList.toggle("ok",g);r.row.classList.toggle("no",!g);if(g)n++});return n},
    report(){return rows.map(r=>({ok:ok(r),line:`"${r.p[0]}" – you chose: ${r.sel.value?`"${r.sel.value}"`:"(nothing)"}; correct: "${r.p[1]}"`}))},
    fill(){rows.forEach(r=>{r.sel.value=r.p[1]})}
  };
}

function parseChoice(t){
  const m=t.match(/\{([^}]*)\}/);
  const before=t.slice(0,m.index),after=t.slice(m.index+m[0].length);
  const raw=m[1].split("|");
  return {before,after,opts:raw.map(o=>o.replace("*","")),correct:raw.find(o=>o.endsWith("*")).replace("*","")};
}
function chooseTask(body){
  body.innerHTML="";
  const rows=CHOOSE.map((t,idx)=>{
    const it=parseChoice(t);
    const row=el("div","row");
    row.appendChild(document.createTextNode(it.before));
    const r={row,it,idx,val:null,pills:[]};
    shuffle(it.opts).forEach(o=>{
      const b=el("button","pill");b.type="button";b.textContent=o;
      b.onclick=()=>{r.val=o;r.pills.forEach(p=>p.classList.toggle("sel",p===b))};
      r.pills.push(b);row.appendChild(b);
    });
    row.appendChild(document.createTextNode(it.after));
    return r;
  });
  shuffle(rows).forEach(r=>body.appendChild(r.row));
  const ok=r=>r.val===r.it.correct;
  return {
    total:rows.length,
    check(){let n=0;rows.forEach(r=>{const g=ok(r);r.row.classList.toggle("ok",g);r.row.classList.toggle("no",!g);if(g)n++});return n},
    report(){return rows.map(r=>({ok:ok(r),line:`${r.it.before}${r.val||"___"}${r.it.after}   (correct: ${r.it.correct})`}))},
    fill(){rows.forEach(r=>{r.val=r.it.correct;r.pills.forEach(p=>p.classList.toggle("sel",p.textContent===r.it.correct))})}
  };
}

function gapTask(data,shuffleRows,numbered){
  return function(body){
    body.innerHTML="";
    const items=data.map(t=>{
      const m=t.match(/\[([^\]]*)\]/);
      const ans=m[1].split("|");
      return {before:t.slice(0,m.index),after:t.slice(m.index+m[0].length),ans};
    });
    const bank=el("div","bank");
    shuffle(items.map(i=>i.ans[0])).forEach(w=>{const s=el("span");s.textContent=w;bank.appendChild(s)});
    body.appendChild(bank);
    const list=el("div");body.appendChild(list);
    const rows=items.map((it,idx)=>{
      const row=el("div","row");
      if(numbered){const n=el("b");n.textContent=(idx+1)+".";row.appendChild(n)}
      row.appendChild(document.createTextNode(it.before));
      const inp=document.createElement("input");inp.type="text";inp.autocomplete="off";inp.autocapitalize="off";inp.spellcheck=false;
      row.appendChild(inp);
      row.appendChild(document.createTextNode(it.after));
      return {row,inp,it,idx};
    });
    (shuffleRows?shuffle(rows):rows).forEach(r=>list.appendChild(r.row));
    const ok=r=>r.it.ans.map(norm).includes(norm(r.inp.value));
    return {
      total:rows.length,
      check(){let n=0;rows.forEach(r=>{const g=ok(r);r.row.classList.toggle("ok",g);r.row.classList.toggle("no",!g);if(g)n++});return n},
      report(){return rows.map(r=>({ok:ok(r),line:plain(`${r.it.before}${r.inp.value.trim()||"___"}${r.it.after}`)+`   (correct: ${r.it.ans[0]})`}))},
      fill(){rows.forEach(r=>{r.inp.value=r.it.ans[0]})}
    };
  };
}

/* ---------- SECTIONS ---------- */
const DEFS=[
 {label:"Match the word with its meaning",ins:"Choose the correct meaning for each kitchen word.",acc:"#e8741a",build:matchTask},
 {label:"Choose the correct word",ins:"Halloween decorations. Click the word that fits the sentence.",acc:"#7a3fb0",build:chooseTask},
 {label:"Complete the sentences",ins:"Use the words from the box. Write one word or phrase in each gap. Use each one once.",acc:"#2c8a8a",build:gapTask(GAPS3,true,false)},
 {label:"Complete the recipe",ins:"Use the verbs from the box. Write the verb in the gap. Use each one once.",acc:"#c2410c",build:gapTask(GAPS4,false,true)}
];
const sections=[];
const tasksEl=document.getElementById("tasks");
DEFS.forEach((d,i)=>{
  const card=el("div","card");card.style.setProperty("--acc",d.acc);
  card.innerHTML=`<h2>Task ${i+1}. ${d.label}</h2><p class="ins">${d.ins}</p>`;
  const body=el("div");card.appendChild(body);
  const btns=el("div","btns");
  const bc=el("button","b");bc.textContent="Check";
  const bs=el("button","b alt");bs.textContent="Show answers";
  const bt=el("button","b alt");bt.textContent="Try again";
  const sc=el("span","score");const ms=el("span","msg");
  btns.append(bc,bs,bt,sc,ms);card.appendChild(btns);tasksEl.appendChild(card);
  const sec={num:i+1,label:d.label,total:0,score:0,checked:false,revealed:false,api:null,log:[],seen:new Set(),lastOk:[]};
  const render=()=>{sec.api=d.build(body);sec.total=sec.api.total;sec.score=0;sec.checked=false;sec.revealed=false;sc.textContent="";ms.textContent="";updateBar()};
  render();
  bc.onclick=()=>{
    if(sec.revealed){ms.textContent="Answers are shown. Press Try again to practise.";return}
    sec.score=sec.api.check();sec.checked=true;record(sec);
    sc.textContent=sec.score+" / "+sec.total;ms.textContent=sec.score===sec.total?"Perfect! 🎉":"Fix the red lines and press Check again.";
    updateBar();
  };
  bs.onclick=()=>{sec.api.fill();sec.revealed=true;sec.score=0;sc.textContent="";ms.textContent="Answers shown (no score).";updateBar()};
  bt.onclick=render;
  sections.push(sec);
});
function record(sec){
  sec.api.report().forEach((r,i)=>{
    sec.lastOk[i]=r.ok;
    if(!r.ok){const k=i+"|"+r.line;if(!sec.seen.has(k)){sec.seen.add(k);sec.log.push({i,line:r.line})}}
  });
}
function updateBar(){
  const tot=sections.reduce((a,s)=>a+s.total,0);
  const got=sections.reduce((a,s)=>a+(s.checked&&!s.revealed?s.score:0),0);
  document.getElementById("prog").textContent=got+" / "+tot;
  document.getElementById("fill").style.width=(tot?got/tot*100:0)+"%";
}
function buildReport(){
  const name=document.getElementById("stuName").value.trim()||"(no name)";
  let out=`Halloween Cupcakes – Vocabulary Homework – ${name} (${new Date().toLocaleString()})\n\n`;
  let got=0,tot=0;
  sections.forEach(s=>{
    tot+=s.total;
    let st;
    if(s.revealed)st="answers shown";
    else if(!s.checked)st="not checked";
    else{st=s.score+" / "+s.total;got+=s.score}
    out+=`Task ${s.num} ${s.label}: ${st}\n`;
  });
  out+=`Total: ${got} / ${tot}\n\nMISTAKES (every wrong answer, including ones fixed on retry)\n`;
  let any=false;
  sections.forEach(s=>{
    if(!s.log.length)return;
    any=true;
    out+=`\nTask ${s.num} ${s.label}\n`;
    s.log.forEach(e=>{out+=`  ✗ ${e.line}   [${s.lastOk[e.i]?"fixed on retry":"still wrong"}]\n`});
  });
  if(!any)out+="\nNo mistakes recorded.\n";
  return out;
}
window.HW={sections,buildReport};
document.getElementById("copyBtn").onclick=()=>{
  const t=buildReport(),m=document.getElementById("copyMsg");
  const fb=()=>{const a=document.createElement("textarea");a.value=t;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(e){}a.remove();m.textContent="Copied! Paste it in the chat."};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>{m.textContent="Copied! Paste it in the chat."},fb)}else fb();
};
</script>
</body>
</html>
