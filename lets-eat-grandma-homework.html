<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{--bg:#1f1a2e;--card:#2a2340;--ink:#f4efe6;--mut:#b9b0cf;--ok:#3ecf8e;--bad:#ff6b6b;--line:#443b66}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Poppins,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.5}

h1{font-size:1.7rem;margin:.4em 0 .1em}
.sub{color:var(--mut);margin:0 0 14px}
#bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line)}.prog{display:flex;gap:12px;align-items:center}#tabs{display:flex;gap:6px;margin-top:8px;overflow-x:auto}.tab{flex:0 0 auto;background:#17132a;color:var(--ink);border:2px solid var(--line);border-radius:20px;padding:5px 14px;font:inherit;font-size:.9rem;cursor:pointer;white-space:nowrap}.tab.on{background:#ffcf5c;color:#1b1530;border-color:#ffcf5c;font-weight:700}.pane{display:none}.pane.on{display:block}.ptext{line-height:2.4}.gn{color:var(--ac);font-size:.7rem;margin:0 2px 0 4px;font-weight:700}.ptext .why{line-height:1.5;margin-top:14px}.ptext select.dd{min-width:2.6em}

.name{margin:14px 0}
input[type=text],textarea{width:100%;background:#17132a;color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit}

.gap{display:inline-block;padding:1px 6px;margin:0 3px;border-radius:6px;text-align:center;font-size:.95rem}

a{color:#ffcf5c}

<body><div class="wrap">
<h1>✏️ Let’s Eat, Grandma!</h1>
<p class="sub">Commas and colons · homework</p>
<div id="bar"><div class="prog"><div class="track"><div class="fill" id="fill"></div></div><b id="score">0 / 0</b></div><div id="tabs"></div></div>
<div class="name"><input type="text" id="who" placeholder="Your name"></div>
<div id="root"></div>
<div class="btns"><button class="btn" id="copy">Copy my results</button><span id="msg"></span></div>
</div>
<script>
const ACC=["#ff9a3c","#b48cff","#4cc9f0","#ff6fa5","#7ddc7d","#ffcf5c","#ff8a5c","#9ad1ff"];
const SECS=[
{part:"1 · Punctuate",tab:"Punctuate",num:"1",title:"Add the missing punctuation",type:"ptext",ac:0,
 instr:"The text has no commas or colons. At each number, choose what belongs there: a comma, a colon, or nothing. Press Check and read the reason for every number.",
 note:"<b>Rule 1</b> lists · <b>Rule 2</b> comma before and/but/so between two clauses · <b>Rule 3</b> time or if clause first · <b>Rule 4</b> starter word · <b>Rule 5</b> extra information · <b>Rule 6</b> colon before a list · <b>Rule 7</b> colon before an explanation · <b>Rule 8</b> no comma splice. A colon needs a complete sentence before it.",
 text:"When we finally arrived in Lisbon{,*|none|:} we were tired{,|none*|:} and hungry. Our hotel{,*|none|:} which was near the old tram line{,*|none|:} had a tiny room{,*|none|:} but the window had a great view. Unfortunately{,*|none|:} the weather was grey on the first day{,*|none|:} so we walked around the old town. We took an early tram{,|none*|:} so that we could see the castle before the crowds. We tried three local dishes{,|none|:*} grilled sardines{,*|none|:} a custard tart{,*|none|:} and a bowl of fish soup. Honestly{,*|none|:} the tart was the best part. I understood why my sister loved the city{,|none|:*} it felt like home.",
 whyList:[
 "<b>1 comma.</b> Rule 3: a time clause (<i>When we finally arrived in Lisbon</i>) comes first, so it is followed by a comma.",
 "<b>2 none.</b> <i>tired and hungry</i> joins two adjectives, not two clauses. No comma.",
 "<b>3 comma.</b> Rule 5: <i>which was near the old tram line</i> is extra information, so it opens a pair of commas.",
 "<b>4 comma.</b> The second comma of the pair closes the extra information.",
 "<b>5 comma.</b> Rule 2: <i>and/but/so</i> between two clauses with their own subjects (<i>Our hotel had… the window had…</i>) needs a comma before <i>but</i>.",
 "<b>6 comma.</b> Rule 4: a comma after the starter word <i>Unfortunately</i>.",
 "<b>7 comma.</b> Rule 2: a comma before <i>so</i> when it shows a result and a new clause follows.",
 "<b>8 none.</b> <i>so that</i> shows purpose, and there is no comma before it.",
 "<b>9 colon.</b> Rule 6: a colon after a complete sentence introduces a list.",
 "<b>10 comma.</b> Rule 1: commas separate the items in a list.",
 "<b>11 comma.</b> Rule 1: the second comma in the list. The comma before the last <i>and</i> (Oxford comma) is optional, so it is not asked here.",
 "<b>12 comma.</b> Rule 4: a comma after the starter word <i>Honestly</i>.",
 "<b>13 colon.</b> Rule 7: a colon after a complete sentence introduces an explanation. A comma here would be a comma splice (Rule 8)."
 ]},
{part:"2 · Comma or no comma",tab:"Comma or not",num:"2",title:"Which sentence is correct?",type:"choice",ac:1,shuf:true,
 instr:"Choose the correctly punctuated sentence. Read the reason after you press Check.",
 items:[
 {s:"Purpose: I left early to be on time. {I left early so that I could catch the first train.*|I left early, so that I could catch the first train.}",why:"<b>So that = purpose, no comma.</b><br><i>She speaks slowly so that everyone can understand.</i> · <i>I wrote it down so that I wouldn’t forget.</i>"},
 {s:"Result: we stayed home because of the rain. {It was raining, so we stayed home.*|It was raining so we stayed home.}",why:"<b>So = result, with a comma</b> (Rule 2): two clauses, two subjects.<br><i>The train was late, so I took a taxi.</i> · <i>I was tired, so I went to bed.</i>"},
 {s:"{I cooked dinner and watched a film.*|I cooked dinner, and watched a film.}",why:"<b>One subject with two verbs: no comma.</b> There are no two clauses here.<br><i>I work in a bank and love my job.</i> · compare <i>I cooked dinner, and he washed up.</i> (two subjects, so a comma)"},
 {s:"I have only one brother. {My brother, Tom, lives in Kazan.*|My brother Tom lives in Kazan.}",why:"<b>Extra information gets commas</b> (Rule 5). With one brother, the name does not tell us which one, so it is extra.<br><i>My wife, Anna, is a doctor.</i> · <i>The capital, Moscow, is huge.</i>"},
 {s:"I have three brothers. {My brother Tom lives in Kazan.*|My brother, Tom, lives in Kazan.}",why:"<b>No commas when the name tells us which one.</b> With three brothers, <i>Tom</i> is essential, so there are no commas.<br><i>My friend Sasha called me.</i> · <i>The author Stephen King wrote it.</i>"},
 {s:"{I usually cook dinner when I get home.*|I usually cook dinner, when I get home.}",why:"<b>A time clause at the end needs no comma</b> (Rule 3). The comma comes only when the clause is first: <i>When I get home, I usually cook dinner.</i>"},
 {s:"{Unfortunately, I can’t come to the party.*|Unfortunately I can’t come to the party.}",why:"<b>A comma after a starter word</b> (Rule 4).<br><i>Honestly, I don’t mind.</i> · <i>However, we stayed.</i> · <i>For example, you can call me.</i>"},
 {s:"Only some of the students passed. {The students who passed the exam were happy.*|The students, who passed the exam, were happy.}",why:"<b>No commas: the clause says which students.</b> Only the ones who passed were happy. Information that identifies someone gets no commas."},
 {s:"All the students passed. {The students, who passed the exam, were happy.*|The students who passed the exam were happy.}",why:"<b>Commas: the clause is extra information.</b> All of them passed, so <i>who passed the exam</i> does not tell us which students (Rule 5)."},
 {s:"{I brought three things: a map, a camera, and a guidebook.*|I brought: a map, a camera, and a guidebook.}",why:"<b>A colon only after a complete sentence</b> (Rule 6). <i>I brought</i> is not complete, so no colon.<br><i>My hobbies are reading and hiking.</i> · <i>I have two hobbies: reading and hiking.</i>"}
 ]},
{part:"3 · Find and fix",tab:"Find and fix",num:"3",title:"Fix the sentence",type:"choice",dd:true,ac:2,
 instr:"Each sentence below has a problem, or it is already correct. Choose a correct version from the list. Sometimes several versions are right: pick any one of them. Read all the fixes after you press Check.",
 note:"<b>Comma splice:</b> two complete sentences joined only by a comma. Test: replace the comma with a period. If both parts are still sentences, it is a splice. <b>Fixes:</b> a period · a semicolon · a comma + and/but/so/or · make one part a clause (<i>Because / Although…</i>). <i>However, therefore, also</i> are not joining words.",
 items:[
 {s:"It was raining heavily, we decided to stay in. {Correct as it is|It was raining heavily, however, we decided to stay in.|It was raining heavily. We decided to stay in.*|It was raining heavily; we decided to stay in.*|It was raining heavily, so we decided to stay in.*|Because it was raining heavily, we decided to stay in.*}",why:"<b>Comma splice.</b> All the fixes: <i>…heavily. We decided…</i> (period) · <i>…heavily; we decided…</i> (semicolon) · <i>…heavily, so we decided…</i> (comma + so) · <i>Because it was raining heavily, we decided…</i> (clause). <i>…heavily, however, we decided…</i> is still a splice."},
 {s:"The museum was closed, however, we enjoyed the walk. {Correct as it is|The museum was closed, however we enjoyed the walk.|The museum was closed. However, we enjoyed the walk.*|The museum was closed; however, we enjoyed the walk.*|The museum was closed, but we enjoyed the walk.*|Although the museum was closed, we enjoyed the walk.*}",why:"<b>Comma splice.</b> <i>However</i> is not a joining word. All the fixes: period + <i>However,</i> · semicolon + <i>however,</i> · comma + <i>but</i> · <i>Although the museum was closed, …</i>"},
 {s:"I was very tired, I went to bed early. {Correct as it is|I was very tired, therefore, I went to bed early.|I was very tired. I went to bed early.*|I was very tired; I went to bed early.*|I was very tired, so I went to bed early.*|Because I was very tired, I went to bed early.*}",why:"<b>Comma splice.</b> <i>Therefore</i> does not fix it either (<i>tired, therefore, I went</i> is still a splice). All the fixes: period · semicolon · comma + <i>so</i> · <i>Because I was very tired, …</i>"},
 {s:"I understood why he loved the city, it felt like home. {Correct as it is|I understood why he loved the city it felt like home.|I understood why he loved the city: it felt like home.*|I understood why he loved the city. It felt like home.*|I understood why he loved the city; it felt like home.*|I understood why he loved the city, because it felt like home.*}",why:"<b>Comma splice.</b> The second sentence explains the first, so a colon is the best fix (Rule 7). A period, a semicolon, or a comma + <i>because</i> also work. No mark at all is a run-on."},
 {s:"My favourite hobbies are: reading, cooking, and hiking. {Correct as it is|My favourite hobbies are; reading, cooking, and hiking.|My favourite hobbies are reading, cooking, and hiking.*|I have three favourite hobbies: reading, cooking, and hiking.*}",why:"<b>A colon after an incomplete sentence.</b> <i>My favourite hobbies are</i> is not complete, so no colon. Either remove the colon, or make the first part a complete sentence (<i>I have three favourite hobbies:</i>)."},
 {s:"Unfortunately I couldn’t come to the party. {Correct as it is|Unfortunately I couldn’t, come to the party.|Unfortunately, I couldn’t come to the party.*}",why:"<b>Missing comma after the starter word</b> (Rule 4). <i>Unfortunately, I couldn’t come to the party.</i>"},
 {s:"I have only one brother. My brother who lives in Prague works as a chef. {Correct as it is|My brother, who lives in Prague works as a chef.|My brother, who lives in Prague, works as a chef.*}",why:"<b>Missing commas around extra information</b> (Rule 5). With one brother, <i>who lives in Prague</i> is extra, so it needs a pair of commas."},
 {s:"When I got home, I started cooking dinner. {Correct as it is*|When I got home I started cooking, dinner.|When I got home. I started cooking dinner.}",why:"<b>Already correct.</b> A time clause at the start is followed by a comma (Rule 3). Not every sentence has a mistake."},
 {s:"I work in a bank, and love my job. {Correct as it is|I work in a bank and love my job.*|I work in a bank, and, love my job.}",why:"<b>Comma before <i>and</i> with one subject.</b> <i>I work… and love…</i> is one subject with two verbs, so there is no comma (Rule 2 needs two clauses)."},
 {s:"I left early, so that I could catch the first train. {Correct as it is|I left early so, that I could catch the first train.|I left early so that I could catch the first train.*}",why:"<b>So that = purpose, so no comma.</b> A comma goes before <i>so</i> only when it means result (<i>I left early, so I caught the train.</i>)."}
 ]},
{part:"4 · Write",tab:"Write",num:"4",title:"Write your own story",type:"write",ac:3,
 instr:"Write 8 or more sentences about a real day, trip or event. Do not show it to anyone: just write. Then reread every comma and test it: replace the comma with a period. If both parts are complete sentences, fix it. The checklist ticks itself."
}
];
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const plain=s=>s.replace(/<[^>]*>/g,"");
const norm=s=>s.toLowerCase().replace(/[’‘]/g,"'").replace(/[.!?,;]+$/,"").replace(/\s+/g," ").trim();
const WORDS=/\b(will|'ll) have \w+/gi;

function choiceItem(it,shuf){
  const parts=it.split(/(\{[^}]*\})/),groups=[];
  parts.forEach(p=>{if(p[0]==="{"){let o=p.slice(1,-1).split("|");if(shuf)for(let k=o.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[o[k],o[j]]=[o[j],o[k]]}groups.push({opts:o.map(x=>x.replace("*","")),ans:o.findIndex(x=>x.includes("*")),alt:o.map((x,k)=>x.includes("*")?k:-1).filter(k=>k>=0),sel:-1})}});
  return {parts,groups};
}
function lineOf(c){
  let gi=0;const s=c.parts.map(p=>{if(p[0]!=="{")return p;const g=c.groups[gi++];return g.sel<0?"___":(g.opts[g.sel]==="none"?"":g.opts[g.sel])}).join("");
  const wr=c.groups.filter(g=>!g.alt.includes(g.sel)).map(g=>g.alt.map(k=>g.opts[k]).join(" | "));
  return {ok:!wr.length,line:s+(wr.length?"   (correct: "+wr.join("; ")+")":"")};
}
function build(sec,box){
  const st={};
  if(sec.d.type==="ptext"){
    const c=choiceItem(sec.d.text,true);let gi=0;
    const html=c.parts.map(p=>{if(p[0]!=="{")return esc(p).replace(/\n\n/g,"<br><br>");const g=gi++;return `<sub class="gn">${g+1}</sub><select class="dd" data-g="${g}"><option value="-1">…</option>`+c.groups[g].opts.map((x,k)=>`<option value="${k}">${esc(x)}</option>`).join("")+`</select>`}).join("");
    box.innerHTML=`<div class="item ptext" id="${sec.id}-0">${html}</div>`;
    const sels=()=>box.querySelectorAll("select");
    box.onchange=e=>{const sl=e.target.closest("select");if(!sl||sec.revealed)return;c.groups[+sl.dataset.g].sel=+sl.value;sl.classList.remove("right","wrong")};
    const txt=[];c.parts.forEach(p=>{if(p[0]!=="{")txt.push(p)});
    const lines=()=>c.groups.map((g,k)=>{const ok=g.sel===g.ans;const bef=txt[k].replace(/\s+/g," ").split(" ").slice(-5).join(" ");const aft=(txt[k+1]||"").replace(/\s+/g," ").trim().split(" ").slice(0,3).join(" ");const ch=g.sel<0?"___":(g.opts[g.sel]==="none"?"":g.opts[g.sel]);
      return {ok,line:"["+(k+1)+"] …"+bef.trim()+ch+" "+aft+"…"+(ok?"":"   (correct: "+g.opts[g.ans]+")")}});
    const mark=()=>{sels().forEach(sl=>{const g=c.groups[+sl.dataset.g];sl.classList.remove("right","wrong");sl.classList.add(g.sel===g.ans?"right":"wrong")});
      const it=box.querySelector(".item");const old=it.querySelector(".why");if(old)old.remove();const d=document.createElement("div");d.className="why";d.innerHTML="<b>Explanations</b><br>"+sec.d.whyList.map(x=>"• "+x).join("<br>");it.appendChild(d)};
    return {total:c.groups.length,
      check(){mark();return c.groups.filter(g=>g.sel===g.ans).length},
      report(){return lines()},
      fill(){c.groups.forEach(g=>g.sel=g.ans);sels().forEach(sl=>sl.value=c.groups[+sl.dataset.g].ans);mark()}};
  }
  if(sec.d.type==="choice"){
    const L=sec.d.items.map(it=>typeof it==="string"?{c:choiceItem(it,sec.d.dd||sec.d.shuf)}:it.tf?{tf:it}:{c:choiceItem(it.s,sec.d.dd||sec.d.shuf),why:it.why});
    const render=()=>{
      box.innerHTML=L.map((o,i)=>{
        if(o.c){let gi=0;const h=o.c.parts.map(p=>{if(p[0]!=="{")return esc(p);const g=gi++;if(sec.d.dd)return `<select class="dd" data-i="${i}" data-g="${g}"><option value="-1">choose…</option>`+o.c.groups[g].opts.map((x,k)=>`<option value="${k}">${esc(x)}</option>`).join("")+`</select>`;return `<span class="pills">`+o.c.groups[g].opts.map((x,k)=>`<button class="pill" data-i="${i}" data-g="${g}" data-k="${k}">${esc(x)}</button>`).join("")+`</span>`}).join("");
          return `<div class="item" id="${sec.id}-${i}"><span class="n">${i+1}.</span>${h}</div>`}
        return `<div class="item" id="${sec.id}-${i}"><span class="n">${i+1}.</span>${esc(o.tf.tf)} <span class="pills"><button class="pill" data-i="${i}" data-k="1">True</button><button class="pill" data-i="${i}" data-k="0">False</button></span></div>`}).join("");
    };
    const paint=(show)=>{
      L.forEach((o,i)=>{const it=$("#"+sec.id+"-"+i);it.classList.remove("ok","no");
        it.querySelectorAll("select").forEach(sl=>{sl.value=o.c.groups[+sl.dataset.g].sel;sl.classList.remove("right","wrong")});
        it.querySelectorAll(".pill").forEach(b=>{b.classList.remove("sel","right","wrong");const k=+b.dataset.k;
          if(o.c){const g=o.c.groups[+b.dataset.g];if(g.sel===k)b.classList.add("sel")}else{if(o.sel===(k===1))b.classList.add("sel")}})});
    };
    const mark=()=>{L.forEach((o,i)=>{const it=$("#"+sec.id+"-"+i);const ok=o.c?lineOf(o.c).ok:o.sel===o.tf.a;it.classList.add(ok?"ok":"no");const wy=o.why||(o.tf&&o.tf.why);const od=it.querySelector(".why");if(od)od.remove();if(wy){const d=document.createElement("div");d.className="why";d.innerHTML=wy;it.appendChild(d)};
      it.querySelectorAll("select").forEach(sl=>{const g=o.c.groups[+sl.dataset.g];sl.classList.add(g.alt.includes(g.sel)?"right":"wrong")});
      it.querySelectorAll(".pill").forEach(b=>{const k=+b.dataset.k;if(o.c){const g=o.c.groups[+b.dataset.g];if(g.sel===k)b.classList.add(g.alt.includes(g.sel)?"right":"wrong")}else if(o.sel===(k===1))b.classList.add(o.sel===o.tf.a?"right":"wrong")})})};
    box.onclick=e=>{const b=e.target.closest(".pill");if(!b||sec.revealed)return;const i=+b.dataset.i,o=L[i];
      if(o.c)o.c.groups[+b.dataset.g].sel=+b.dataset.k;else o.sel=b.dataset.k==="1";paint();};
    box.onchange=e=>{const sl=e.target.closest("select");if(!sl||sec.revealed)return;L[+sl.dataset.i].c.groups[+sl.dataset.g].sel=+sl.value};
    render();
    return {total:L.length,
      check(){mark();return L.filter(o=>o.c?lineOf(o.c).ok:o.sel===o.tf.a).length},
      report(){return L.map(o=>o.c?lineOf(o.c):{ok:o.sel===o.tf.a,line:`"${o.tf.tf}" – you chose ${o.sel===undefined?"nothing":o.sel?"True":"False"}; correct: ${o.tf.a?"True":"False"}`+(o.tf.fix?" ("+o.tf.fix+")":"")})},
      fill(){L.forEach(o=>{if(o.c)o.c.groups.forEach(g=>g.sel=g.ans);else o.sel=o.tf.a});paint();mark()}};
  }
  if(sec.d.type==="gap"){
    const L=sec.d.items.map(s=>{const m=s.match(/\[([^\]]+)\]/);return {pre:s.slice(0,m.index),post:s.slice(m.index+m[0].length),ans:m[1].split("/")[0]+(m[1].includes("/")?"/"+m[1].split("/").slice(1).join("/"):"")}});
    const bk=sec.d.bank?sec.d.bank.slice():null;if(bk)for(let k=bk.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[bk[k],bk[j]]=[bk[j],bk[k]]}
    box.innerHTML=(bk?`<div class="bank">`+bk.map(w=>`<span>${w}</span>`).join("")+`</div>`:"")+L.map((o,i)=>`<div class="item" id="${sec.id}-${i}"><span class="n">${i+1}.</span>${esc(o.pre)}<input type="text" class="gap" style="width:${sec.d.nohint?16:o.ans.split("/")[0].length+3}ch" placeholder="${sec.d.nohint?"":o.ans[0]+"…"}" autocomplete="off" autocapitalize="off" spellcheck="false" data-i="${i}">${esc(o.post)}</div>`).join("");
    const val=i=>box.querySelectorAll(".gap")[i].value;
    const okf=i=>L[i].ans.split("/").some(a=>norm(val(i))===norm(a));
    return {total:L.length,
      check(){let n=0;L.forEach((o,i)=>{const ok=okf(i);if(ok)n++;const it=$("#"+sec.id+"-"+i);it.classList.remove("ok","no");it.classList.add(ok?"ok":"no")});return n},
      report(){return L.map((o,i)=>{const v=val(i).trim();return {ok:okf(i),line:o.pre+(v||"___")+o.post+(okf(i)?"":"   (correct: "+o.ans.split("/")[0]+")")}})},
      fill(){L.forEach((o,i)=>box.querySelectorAll(".gap")[i].value=o.ans.split("/")[0]);this.check()}};
  }
  if(sec.d.type==="write"){
    box.innerHTML=`<textarea rows="9" id="wr" placeholder="Write here..."></textarea><ul class="check" id="ck"><li data-k="s">8 or more sentences</li><li data-k="l">a list with commas (a, b, and c)</li><li data-k="c">a comma before and / but / so between two clauses</li><li data-k="o">a starter word with a comma (However, Unfortunately, Honestly…)</li><li data-k="k">a colon after a complete sentence</li></ul><p class="instr">Not scored. Your text goes into the results you copy.</p>`;
    const ta=$("#wr",box);const info=()=>{const t=ta.value.replace(/’/g,"'");const sn=(t.match(/[^.!?]+[.!?]+/g)||[]).length;
      const ok={s:sn>=8,l:/[\w'-]+(?: [\w'-]+){0,2}, [\w'-]+(?: [\w'-]+){0,2},? (and|or) /i.test(t),c:/, (and|but|so) /i.test(t),o:/(^|[.!?]\s+)(However|Unfortunately|Luckily|Honestly|Fortunately|Finally|Firstly|Next|Surprisingly|Sadly|Obviously|Clearly|Meanwhile|Later|Eventually|For example|In fact|Fortunately),/i.test(t),k:/[a-z]: [a-z]/i.test(t)};
      Object.keys(ok).forEach(k=>$("[data-k="+k+"]",box).classList.toggle("y",ok[k]))};
    ta.oninput=info;
    return {total:0,check(){return 0},report(){return []},fill(){},text:()=>ta.value.trim()};
  }
}
const root=$("#root");
const PANES=[];let cur=null;
const S=SECS.map((d,idx)=>{
  if(d.part){cur=document.createElement("div");cur.className="pane"+(PANES.length?"":" on");cur.dataset.t=d.tab;PANES.push({tab:d.tab,el:cur});root.appendChild(cur)}
  const sec=Object.assign({id:"t"+d.num,score:0,checked:false,revealed:false,log:[],seen:new Set(),lastOk:[]},{d});
  const card=document.createElement("section");card.className="card";card.style.setProperty("--ac",ACC[d.ac]);
  card.innerHTML=`<h2><span>${d.num}</span>${d.title}</h2><p class="instr">${d.instr}</p>`+
   (false?`<div class="note"><iframe src="https://www.youtube-nocookie.com/embed/R-VRAemIvbI?start=17" allowfullscreen title="Halloween video"></iframe><p style="margin:8px 0 0">Can't see it? <a href="https://www.youtube.com/watch?v=R-VRAemIvbI&t=17s" target="_blank" rel="noopener">Open the video on YouTube</a>.</p></div>`:"")+
   (d.note?`<div class="note">${d.note}</div>`:"")+`<div class="body"></div>`+
   (d.type!=="write"?`<div class="btns"><button class="btn" data-a="c">Check</button><button class="btn sec" data-a="s">Show answers</button><button class="btn sec" data-a="r">Try again</button><span class="res"></span></div>`:"");
  cur.appendChild(card);
  const boxEl=$(".body",card);
  sec.mount=()=>{sec.api=build(sec,boxEl);sec.api.sec=sec};
  sec.mount();
  const res=$(".res",card);
  card.addEventListener("click",e=>{const a=e.target.dataset&&e.target.dataset.a;if(!a)return;
    if(a==="c"){if(sec.revealed){res.textContent="Answers were shown. Press Try again first.";return}
      sec.score=sec.api.check();sec.checked=true;record(sec);res.textContent=sec.score+" / "+sec.api.total;upd()}
    if(a==="s"){sec.api.fill();sec.revealed=true;sec.checked=false;sec.score=0;res.textContent="Answers shown (no score)";upd()}
    if(a==="r"){sec.mount();sec.revealed=false;sec.checked=false;sec.score=0;res.textContent="";upd()}});
  sec.pane=PANES.length-1;return sec;
});
const tabs=$("#tabs");PANES.forEach((p,i)=>{const b=document.createElement("button");b.className="tab"+(i?"":" on");b.dataset.i=i;p.btn=b;tabs.appendChild(b);b.onclick=()=>{PANES.forEach((q,j)=>{q.el.classList.toggle("on",j===i);q.btn.classList.toggle("on",j===i)});window.scrollTo({top:0,behavior:"smooth"})}});
function record(sec){
  sec.api.report().forEach((r,i)=>{sec.lastOk[i]=r.ok;if(!r.ok){const k=i+"|"+r.line;if(!sec.seen.has(k)){sec.seen.add(k);sec.log.push({i,line:r.line})}}});
}
function upd(){
  const tot=S.reduce((a,s)=>a+s.api.total,0),got=S.reduce((a,s)=>a+(s.checked&&!s.revealed?s.score:0),0);
  PANES.forEach((p,i)=>{const ss=S.filter(x=>x.pane===i);const t=ss.reduce((a,x)=>a+x.api.total,0),g=ss.reduce((a,x)=>a+(x.checked&&!x.revealed?x.score:0),0);p.btn.textContent=p.tab+" "+g+"/"+t});
  $("#score").textContent=got+" / "+tot;$("#fill").style.width=(tot?got/tot*100:0)+"%";
}
function buildReport(){
  const nm=$("#who").value.trim()||"(no name)";
  let o=`Punctuation homework – ${nm} (${new Date().toLocaleString()})\n\n`;let T=0,G=0;
  S.forEach(s=>{if(s.d.type==="write")return;const st=s.revealed?"answers shown":s.checked?s.score+" / "+s.api.total:"not checked";
    o+=`Task ${s.d.num} ${s.d.title}: ${st}\n`;T+=s.api.total;if(s.checked&&!s.revealed)G+=s.score});
  o+=`\nTotal: ${G} / ${T}\n\nMISTAKES (every wrong answer, including ones fixed on retry)\n`;
  let any=false;
  S.forEach(s=>{if(!s.log.length)return;any=true;o+=`\nTask ${s.d.num} ${s.d.title}\n`;
    s.log.forEach(e=>{o+=`  ✗ ${e.line}   [${s.lastOk[e.i]?"fixed on retry":"still wrong"}]\n`})});
  if(!any)o+="\n(none)\n";
  S.forEach(s=>{if(s.d.type==="write"){const t=s.api.text();if(t)o+=`\nTask ${s.d.num} Writing (not scored):\n${t}\n`}});
  return o;
}
window.HW={sections:S,buildReport};
$("#copy").onclick=()=>{const t=buildReport();const done=()=>{$("#msg").textContent="Copied! Paste it in the chat."};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,fb)}else fb();
  function fb(){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(e){}a.remove();done()}};
upd();
</script></body></html>
